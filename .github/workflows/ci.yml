name: Java CI with Gradle Spotless

on:
    push:
        branches: [ "main", "dev" ]
    pull_request:
        branches: [ "main", "dev" ]

jobs:
    style-check:
        runs-on: ubuntu-latest

        steps:
            # 1. 소스 코드 가져오기
            - uses: actions/checkout@v4

            # 2. JDK 설정
            - name: Set up JDK 17
              uses: actions/setup-java@v4
              with:
                  java-version: '17'
                  distribution: 'temurin'
                  cache: gradle

            # 3. Gradle 실행 권한 부여. 리눅스 환경이므로 필요
            - name: Grant execute permission for gradlew
              run: chmod +x gradlew

            # 4. Spotless 검사 실행
            - name: Run Spotless Check
              run: ./gradlew spotlessCheck
