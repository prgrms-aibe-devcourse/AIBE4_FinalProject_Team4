<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="ko">
<head>
    <meta charset="UTF-8">
    <title>삭제된 프로젝트</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { font-family: 'Segoe UI', sans-serif; background: #eef2ff; display: flex; align-items: center; justify-content: center; min-height: 100vh; }
        .card { text-align: center; padding: 48px; }
        .icon { font-size: 4rem; line-height: 1; margin-bottom: 16px; }
        .title { font-size: 1.5rem; font-weight: 700; color: #3730a3; margin-bottom: 12px; }
        .message { color: #4338ca; background: #e0e7ff; padding: 12px 20px; border-radius: 8px; margin-bottom: 28px; }
        .btn { display: inline-block; color: #fff; background: #6366f1; text-decoration: none;
               font-weight: 600; padding: 10px 24px; border-radius: 8px; transition: background 0.15s; }
        .btn:hover { background: #4f46e5; }
    </style>
</head>
<body>
    <div class="card">
        <div class="icon">🗑️</div>
        <div class="title">삭제된 프로젝트입니다.</div>
        <div class="message">이 프로젝트는 이미 삭제되어 더 이상 접근할 수 없습니다.</div>
        <a href="/member/dashboard" class="btn">메인 화면으로 돌아가기</a>
    </div>
</body>
</html>
