<!DOCTYPE html>
<html lang="ko" xmlns:th="http://www.thymeleaf.org">
<head>
    <th:block th:replace="~{common/fragments/head :: head-meta('로그인')}"></th:block>
    <th:block th:replace="~{common/fragments/head :: head-resources}"></th:block>
</head>
<body class="min-h-screen bg-surface-base flex flex-col items-center justify-center px-4 py-8 sm:py-12 font-sans antialiased text-base text-docu-ink">

<a href="#login-main"
   class="sr-only-focusable fixed top-3 left-3 z-[300] px-4 py-2 bg-docu-primary text-white rounded-docu-btn shadow-docu-sm
          focus-visible:outline-none focus-visible:ring-2 focus-visible:ring-docu-primary focus-visible:ring-offset-2">
    로그인 본문으로 건너뛰기
</a>

<!-- 로고 -->
<a href="/"
   class="flex items-center gap-2 mb-8 sm:mb-10 select-none rounded-docu-btn focus-ring"
   aria-label="Documind 홈으로 이동">
    <img src="/images/logo.png" alt="Documind 로고" class="h-8 w-auto object-contain">
</a>

<main id="login-main" class="w-full max-w-md" tabindex="-1">

    <!-- Step 1 -->
    <section id="step-1"
             aria-labelledby="login-step-1-title"
             class="card-modal p-6 sm:p-8 transition-all duration-300">

        <div class="text-center mb-8">
            <div class="inline-flex items-center gap-1.5 px-3 py-1 mb-4 bg-surface-base rounded-full border border-divider text-xs text-docu-secondary">
                <span class="w-4 h-4 bg-docu-primary text-white rounded-full text-[10px] flex items-center justify-center font-bold">1</span>
                <span>1단계 / 2단계</span>
            </div>
            <h1 id="login-step-1-title" class="text-h1 text-docu-ink mb-2">어떤 역할로 시작하시나요?</h1>
            <p class="text-sm text-docu-secondary">역할에 따라 접근 권한이 달라집니다</p>
        </div>

        <div th:if="${isInviteFlow}"
             class="mb-6 card-base bg-docu-primary-light/60 border-docu-primary/30 px-4 py-3 text-sm text-docu-primary-dark text-center leading-relaxed">
            초대받으신 프로젝트에 합류하려면<br><b>일반 직원</b>으로 로그인해주세요.
        </div>

        <div class="space-y-3">
            <button th:unless="${isInviteFlow}"
                    type="button"
                    data-role="CEO"
                    onclick="selectRole(this)"
                    class="role-card card-base card-shadow-sm w-full text-left p-5 border-2 border-divider hover:border-docu-primary/60 hover:bg-surface-point transition-all duration-200 group focus-ring">
                <div class="flex items-center gap-4">
                    <div class="w-10 h-10 rounded-docu-btn flex items-center justify-center shrink-0 transition-all duration-200 bg-docu-warning-light group-hover:bg-docu-warning-light/90">
                        <svg class="w-5 h-5 text-docu-warning-dark/80 group-hover:text-docu-warning-dark transition-colors duration-200"
                             fill="none" stroke="currentColor" viewBox="0 0 24 24" aria-hidden="true">
                            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
                                  d="M19 21V5a2 2 0 00-2-2H7a2 2 0 00-2 2v16m14 0h2m-2 0h-5m-9 0H3m2 0h5M9 7h1m-1 4h1m4-4h1m-1 4h1m-5 10v-5a1 1 0 011-1h2a1 1 0 011 1v5m-4 0h4"/>
                        </svg>
                    </div>
                    <div>
                        <div class="text-sm font-bold text-docu-ink">관리자 (CEO)</div>
                        <div class="text-xs text-docu-secondary mt-0.5">회사 생성, 프로젝트 관리, 팀원 초대</div>
                    </div>
                    <svg class="w-5 h-5 text-divider group-hover:text-docu-primary ml-auto shrink-0 transition-colors duration-200"
                         fill="none" stroke="currentColor" viewBox="0 0 24 24" aria-hidden="true">
                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 5l7 7-7 7"/>
                    </svg>
                </div>
            </button>

            <button type="button"
                    data-role="EMPLOYEE"
                    onclick="selectRole(this)"
                    class="role-card card-base card-shadow-sm w-full text-left p-5 border-2 border-divider hover:border-docu-primary/60 hover:bg-surface-point transition-all duration-200 group focus-ring">
                <div class="flex items-center gap-4">
                    <div class="w-10 h-10 rounded-docu-btn flex items-center justify-center shrink-0 transition-all duration-200 bg-docu-primary-light group-hover:bg-docu-primary-light/90">
                        <svg class="w-5 h-5 text-docu-primary/80 group-hover:text-docu-primary-dark transition-colors duration-200"
                             fill="none" stroke="currentColor" viewBox="0 0 24 24" aria-hidden="true">
                            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
                                  d="M16 7a4 4 0 11-8 0 4 4 0 018 0zM12 14a7 7 0 00-7 7h14a7 7 0 00-7-7z"/>
                        </svg>
                    </div>
                    <div>
                        <div class="text-sm font-bold text-docu-ink">일반 직원</div>
                        <div class="text-xs text-docu-secondary mt-0.5">이슈 확인, 문서 검색, 팀 협업</div>
                    </div>
                    <svg class="w-5 h-5 text-divider group-hover:text-docu-primary ml-auto shrink-0 transition-colors duration-200"
                         fill="none" stroke="currentColor" viewBox="0 0 24 24" aria-hidden="true">
                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 5l7 7-7 7"/>
                    </svg>
                </div>
            </button>
        </div>
    </section>

    <!-- Step 2 -->
    <section id="step-2"
             aria-labelledby="login-step-2-title"
             class="hidden card-modal p-6 sm:p-8 transition-all duration-300">

        <div class="text-center mb-8">
            <div class="inline-flex items-center gap-1.5 px-3 py-1 mb-4 bg-surface-base rounded-full border border-divider text-xs text-docu-secondary">
                <span class="w-4 h-4 bg-docu-primary text-white rounded-full text-[10px] flex items-center justify-center font-bold">2</span>
                <span>2단계 / 2단계</span>
            </div>
            <h1 id="login-step-2-title" class="text-h1 text-docu-ink mb-2">소셜 계정으로 계속하기</h1>
            <p class="text-sm text-docu-secondary">
                <span id="selected-role-label" class="font-semibold text-docu-primary"></span>
                으로 로그인합니다
            </p>
        </div>

        <div class="space-y-3">
            <a id="google-oauth-btn"
               th:href="@{/oauth2/authorization/google(redirect_after_login=${redirectUrl})}"
               class="flex items-center justify-center gap-3 w-full px-5 py-3.5 bg-surface-base hover:bg-white text-docu-ink font-medium rounded-docu-btn border border-divider shadow-docu-sm transition-all duration-200 text-sm
                      focus-visible:outline-none focus-visible:ring-2 focus-visible:ring-docu-primary focus-visible:ring-offset-2"
               aria-label="Google 계정으로 계속하기">
                <svg class="w-5 h-5 shrink-0" viewBox="0 0 24 24" aria-hidden="true">
                    <path fill="#4285F4" d="M22.56 12.25c0-.78-.07-1.53-.2-2.25H12v4.26h5.92c-.26 1.37-1.04 2.53-2.21 3.31v2.77h3.57c2.08-1.92 3.28-4.74 3.28-8.09z"/>
                    <path fill="#34A853" d="M12 23c2.97 0 5.46-.98 7.28-2.66l-3.57-2.77c-.98.66-2.23 1.06-3.71 1.06-2.86 0-5.29-1.93-6.16-4.53H2.18v2.84C3.99 20.53 7.7 23 12 23z"/>
                    <path fill="#FBBC05" d="M5.84 14.09c-.22-.66-.35-1.36-.35-2.09s.13-1.43.35-2.09V7.07H2.18C1.43 8.55 1 10.22 1 12s.43 3.45 1.18 4.93l2.85-2.22.81-.62z"/>
                    <path fill="#EA4335" d="M12 5.38c1.62 0 3.06.56 4.21 1.64l3.15-3.15C17.45 2.09 14.97 1 12 1 7.7 1 3.99 3.47 2.18 7.07l3.66 2.84c.87-2.6 3.3-4.53 6.16-4.53z"/>
                </svg>
                Google로 계속하기
            </a>

            <a id="github-oauth-btn"
               th:href="@{/oauth2/authorization/github(redirect_after_login=${redirectUrl})}"
               class="flex items-center justify-center gap-3 w-full px-5 py-3.5 bg-docu-ink hover:bg-gray-800 text-white font-medium rounded-docu-btn shadow-docu-sm transition-all duration-200 text-sm
                      focus-visible:outline-none focus-visible:ring-2 focus-visible:ring-docu-primary focus-visible:ring-offset-2"
               aria-label="GitHub 계정으로 계속하기">
                <svg class="w-5 h-5 shrink-0" viewBox="0 0 24 24" fill="currentColor" aria-hidden="true">
                    <path d="M12 0c-6.626 0-12 5.373-12 12 0 5.302 3.438 9.8 8.207 11.387.599.111.793-.261.793-.577v-2.234c-3.338.726-4.033-1.416-4.033-1.416-.546-1.387-1.333-1.756-1.333-1.756-1.089-.745.083-.729.083-.729 1.205.084 1.839 1.237 1.839 1.237 1.07 1.834 2.807 1.304 3.492.997.107-.775.418-1.305.762-1.604-2.665-.305-5.467-1.334-5.467-5.931 0-1.311.469-2.381 1.236-3.221-.124-.303-.535-1.524.117-3.176 0 0 1.008-.322 3.301 1.23.957-.266 1.983-.399 3.003-.404 1.02.005 2.047.138 3.006.404 2.291-1.552 3.297-1.23 3.297-1.23.653 1.653.242 2.874.118 3.176.77.84 1.235 1.911 1.235 3.221 0 4.609-2.807 5.624-5.479 5.921.43.372.823 1.102.823 2.222v3.293c0 .319.192.694.801.576 4.765-1.589 8.199-6.086 8.199-11.386 0-6.627-5.373-12-12-12z"/>
                </svg>
                GitHub로 계속하기
            </a>
        </div>

        <button type="button"
                onclick="goBack()"
                class="mt-6 w-full flex items-center justify-center gap-2 py-2 rounded-docu-btn text-sm text-docu-secondary hover:text-docu-ink transition-colors focus-ring">
            <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24" aria-hidden="true">
                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15 19l-7-7 7-7"/>
            </svg>
            역할 선택으로 돌아가기
        </button>
    </section>

    <!-- Role Conflict -->
    <section id="step-role-conflict"
             aria-labelledby="role-conflict-title"
             class="hidden card-modal p-6 sm:p-8 transition-all duration-300">

        <div class="text-center mb-8">
            <div class="inline-flex items-center justify-center w-14 h-14 bg-docu-warning-light rounded-docu-card mb-4" aria-hidden="true">
                <svg class="w-7 h-7 text-docu-warning" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
                          d="M12 9v2m0 4h.01m-6.938 4h13.856c1.54 0 2.502-1.667 1.732-3L13.732 4c-.77-1.333-2.694-1.333-3.464 0L3.34 16c-.77 1.333.192 3 1.732 3z"/>
                </svg>
            </div>
            <h1 id="role-conflict-title" class="text-h1 text-docu-ink mb-2">이미 가입된 계정이 있습니다</h1>
            <p class="text-sm text-docu-secondary">
                이 계정은
                <span id="existing-role-label" class="font-semibold text-docu-primary"></span>
                계정으로 가입되어 있습니다.
            </p>
        </div>

        <div class="space-y-3">
            <a id="role-conflict-google-btn"
               href="/oauth2/authorization/google"
               class="hidden flex items-center justify-center gap-3 w-full px-5 py-3.5 bg-surface-base hover:bg-white text-docu-ink font-medium rounded-docu-btn border border-divider shadow-docu-sm transition-all duration-200 text-sm
                      focus-visible:outline-none focus-visible:ring-2 focus-visible:ring-docu-primary focus-visible:ring-offset-2"
               aria-label="Google 계정으로 로그인하기">
                <svg class="w-5 h-5 shrink-0" viewBox="0 0 24 24" aria-hidden="true">
                    <path fill="#4285F4" d="M22.56 12.25c0-.78-.07-1.53-.2-2.25H12v4.26h5.92c-.26 1.37-1.04 2.53-2.21 3.31v2.77h3.57c2.08-1.92 3.28-4.74 3.28-8.09z"/>
                    <path fill="#34A853" d="M12 23c2.97 0 5.46-.98 7.28-2.66l-3.57-2.77c-.98.66-2.23 1.06-3.71 1.06-2.86 0-5.29-1.93-6.16-4.53H2.18v2.84C3.99 20.53 7.7 23 12 23z"/>
                    <path fill="#FBBC05" d="M5.84 14.09c-.22-.66-.35-1.36-.35-2.09s.13-1.43.35-2.09V7.07H2.18C1.43 8.55 1 10.22 1 12s.43 3.45 1.18 4.93l2.85-2.22.81-.62z"/>
                    <path fill="#EA4335" d="M12 5.38c1.62 0 3.06.56 4.21 1.64l3.15-3.15C17.45 2.09 14.97 1 12 1 7.7 1 3.99 3.47 2.18 7.07l3.66 2.84c.87-2.6 3.3-4.53 6.16-4.53z"/>
                </svg>
                Google 계정으로 로그인하기
            </a>

            <a id="role-conflict-github-btn"
               href="/oauth2/authorization/github"
               class="hidden flex items-center justify-center gap-3 w-full px-5 py-3.5 bg-docu-ink hover:bg-gray-800 text-white font-medium rounded-docu-btn shadow-docu-sm transition-all duration-200 text-sm
                      focus-visible:outline-none focus-visible:ring-2 focus-visible:ring-docu-primary focus-visible:ring-offset-2"
               aria-label="GitHub 계정으로 계속하기">
                <svg class="w-5 h-5 shrink-0" viewBox="0 0 24 24" fill="currentColor" aria-hidden="true">
                    <path d="M12 0c-6.626 0-12 5.373-12 12 0 5.302 3.438 9.8 8.207 11.387.599.111.793-.261.793-.577v-2.234c-3.338.726-4.033-1.416-4.033-1.416-.546-1.387-1.333-1.756-1.333-1.756-1.089-.745.083-.729.083-.729 1.205.084 1.839 1.237 1.839 1.237 1.07 1.834 2.807 1.304 3.492.997.107-.775.418-1.305.762-1.604-2.665-.305-5.467-1.334-5.467-5.931 0-1.311.469-2.381 1.236-3.221-.124-.303-.535-1.524.117-3.176 0 0 1.008-.322 3.301 1.23.957-.266 1.983-.399 3.003-.404 1.02.005 2.047.138 3.006.404 2.291-1.552 3.297-1.23 3.297-1.23.653 1.653.242 2.874.118 3.176.77.84 1.235 1.911 1.235 3.221 0 4.609-2.807 5.624-5.479 5.921.43.372.823 1.102.823 2.222v3.293c0 .319.192.694.801.576 4.765-1.589 8.199-6.086 8.199-11.386 0-6.627-5.373-12-12-12z"/>
                </svg>
                GitHub로 계속하기
            </a>

            <button type="button"
                    onclick="goBackFromRoleConflict()"
                    class="mt-2 w-full flex items-center justify-center gap-2 py-2 rounded-docu-btn text-sm text-docu-secondary hover:text-docu-ink transition-colors focus-ring">
                <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24" aria-hidden="true">
                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15 19l-7-7 7-7"/>
                </svg>
                처음으로 돌아가기
            </button>
        </div>
    </section>

    <!-- Email Conflict -->
    <section id="step-conflict"
             aria-labelledby="email-conflict-title"
             class="hidden card-modal p-6 sm:p-8 transition-all duration-300">

        <div class="text-center mb-6">
            <h1 id="email-conflict-title" class="text-h2 text-docu-ink mb-2">이 이메일로 사용 중인 계정이 있습니다</h1>

            <div class="mt-6 card-base bg-surface-base px-4 py-4 flex items-center gap-4 text-left">
                <div id="conflict-avatar"
                     class="w-12 h-12 rounded-full overflow-hidden shrink-0 flex items-center justify-center"
                     aria-hidden="true"></div>
                <div class="min-w-0">
                    <div class="font-bold text-docu-ink flex items-center gap-2 flex-wrap">
                        <span id="conflict-nickname"></span>
                        <span id="conflict-role-badge"
                              class="hidden badge-base"></span>
                    </div>
                    <div class="text-xs text-docu-secondary mt-0.5 truncate" id="conflict-email"></div>
                </div>
            </div>

            <p class="mt-6 text-sm text-docu-secondary">로그인 방식을 선택해주세요.</p>
        </div>

        <div id="conflict-buttons" class="space-y-3"></div>

        <button type="button"
                onclick="goBackFromConflict()"
                class="mt-4 w-full flex items-center justify-center gap-2 py-2 rounded-docu-btn text-sm text-docu-secondary hover:text-docu-ink transition-colors focus-ring">
            <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24" aria-hidden="true">
                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15 19l-7-7 7-7"/>
            </svg>
            처음으로 돌아가기
        </button>
    </section>

</main>

<script src="/js/member/Login.js"></script>
</body>
</html>
