<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="ko">

<!-- ==================== 파일 수정 모달 ==================== -->
<div th:fragment="editModal" id="editModal" class="hidden fixed inset-0 z-50 flex items-center justify-center">
    <div class="absolute inset-0 bg-black/40" onclick="closeModal('editModal')"></div>
    <div class="relative card-modal w-full max-w-lg max-h-[90vh] flex flex-col">
        <div class="flex items-center justify-between px-6 py-5 border-b border-divider bg-surface-sub rounded-t-docu-modal">
            <h2 class="text-h2 text-docu-ink">파일 수정</h2>
            <button onclick="closeModal('editModal')" class="text-docu-secondary hover:text-docu-ink transition-colors rounded-docu-btn focus-ring">
                <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M6 18L18 6M6 6l12 12"/></svg>
            </button>
        </div>
        <div class="flex-1 overflow-y-auto px-6 py-5">
            <div id="editError" class="hidden mb-4 p-3 bg-docu-danger-light border border-docu-danger rounded-docu-btn text-sm text-docu-danger"></div>
            <input type="hidden" id="editDocumentId">
            <input type="hidden" id="editGroupId">
            <!-- 대분류명 (비활성화) -->
            <div class="mb-5">
                <label class="form-label mb-2">대분류명 <span class="text-docu-danger">*</span></label>
                <input type="text" id="editGroupName" disabled
                       class="form-input form-disabled">
            </div>
            <!-- 카테고리 (비활성화) -->
            <div class="mb-5">
                <label class="form-label mb-2">카테고리 <span class="text-docu-danger">*</span></label>
                <input type="text" id="editCategory" disabled
                       class="form-input form-disabled">
            </div>
            <!-- 버전 -->
            <div class="mb-5">
                <label class="form-label mb-2">버전 <span class="text-docu-danger">*</span> <span id="editVersionHint" class="text-docu-secondary font-normal">(현재버전: v1.0.0)</span></label>
                <div class="flex items-center gap-2">
                    <input type="number" id="editMajor" value="1" min="0" max="999"
                           class="form-input text-center">
                    <span class="text-docu-secondary text-lg font-bold">.</span>
                    <input type="number" id="editMinor" value="0" min="0" max="999"
                           class="form-input text-center">
                    <span class="text-docu-secondary text-lg font-bold">.</span>
                    <input type="number" id="editPatch" value="0" min="0" max="999"
                           class="form-input text-center">
                </div>
                <div class="flex text-xs text-docu-secondary mt-1">
                    <span class="flex-1 text-center">Major</span>
                    <span class="w-4"></span>
                    <span class="flex-1 text-center">Minor</span>
                    <span class="w-4"></span>
                    <span class="flex-1 text-center">Patch</span>
                </div>
            </div>
            <!-- 파일 교체 (선택) -->
            <div class="mb-5">
                <div class="flex items-center justify-between mb-2">
                    <label class="form-label">파일 교체 (선택)</label>
                    <label class="relative inline-flex items-center cursor-pointer">
                        <input type="checkbox" id="editFileToggle" class="sr-only peer" onchange="toggleEditFile()">
                        <div class="w-9 h-5 bg-surface-muted rounded-full transition-colors
                                    peer-checked:bg-docu-success
                                    peer-focus-visible:ring-2 peer-focus-visible:ring-docu-primary peer-focus-visible:ring-offset-2
                                    after:content-[''] after:absolute after:top-[2px] after:left-[2px]
                                    after:bg-white after:border-divider after:border after:rounded-full after:h-4 after:w-4
                                    after:transition-all peer-checked:after:translate-x-full peer-checked:after:border-white"></div>
                    </label>
                </div>
                <div id="editFileArea" class="hidden">
                    <div id="editDropZone"
                         class="border-2 border-dashed border-divider rounded-docu-card p-8 text-center cursor-pointer hover:border-docu-primary hover:bg-docu-primary-light/30 transition"
                         onclick="document.getElementById('editFile').click()">
                        <svg class="w-10 h-10 text-docu-primary mx-auto mb-3" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M7 16a4 4 0 01-.88-7.903A5 5 0 1115.9 6L16 6a5 5 0 011 9.9M15 13l-3-3m0 0l-3 3m3-3v12"/></svg>
                        <p class="text-sm font-medium text-docu-ink">파일을 드래그하거나 클릭하여 업로드</p>
                        <p class="text-xs text-docu-secondary mt-1">최대 20MB / PDF, DOC, DOCX, XLS, XLSX, PPT, PPTX, TXT, JPG, PNG</p>
                    </div>
                    <div id="editFileInfo" class="hidden mt-3 flex items-center justify-between p-3 bg-surface-sub rounded-docu-btn">
                        <span id="editFileName" class="text-sm text-docu-ink truncate"></span>
                        <button onclick="clearEditFile()" class="text-docu-secondary hover:text-docu-danger transition-colors">
                            <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M6 18L18 6M6 6l12 12"/></svg>
                        </button>
                    </div>
                    <input type="file" id="editFile" class="hidden" onchange="onEditFileSelected(this)">
                </div>
            </div>
            <!-- 패치노트에서 제외 -->
            <div class="mb-2 flex items-start gap-3 p-4 bg-surface-sub rounded-docu-btn">
                <input type="checkbox" id="editExcludeFromPatchNote" class="mt-0.5 w-4 h-4 rounded border-divider text-docu-primary focus:ring-docu-primary">
                <div>
                    <label for="editExcludeFromPatchNote" class="text-sm font-semibold text-docu-ink cursor-pointer">패치노트에서 제외</label>
                    <p class="text-xs text-docu-secondary mt-0.5">체크 시 해당 문서는 패치노트의 <span class="text-docu-primary font-medium">[업데이트 피드]</span>에 반영되지 않습니다.</p>
                    <p class="text-xs text-docu-secondary mt-0.5">※ PDF 파일만 패치노트에 반영되며, 그 외 형식은 체크 여부와 관계없이 자동으로 제외됩니다.</p>
                </div>
            </div>
        </div>
        <div class="flex items-center justify-end gap-3 px-6 py-4 border-t border-divider bg-surface-sub rounded-b-docu-modal">
            <button onclick="closeModal('editModal')" class="btn-ghost">취소</button>
            <button onclick="submitEdit()" class="btn-primary">수정</button>
        </div>
    </div>
</div>

<!-- ==================== 삭제 확인 모달 ==================== -->
<div th:fragment="deleteModal" id="deleteModal" class="hidden fixed inset-0 z-50 flex items-center justify-center">
    <div class="absolute inset-0 bg-black/40" onclick="closeModal('deleteModal')"></div>
    <div class="relative card-modal w-full max-w-sm overflow-hidden">
        <div class="h-1 bg-gradient-to-r from-docu-danger via-docu-warning to-docu-success"></div>
        <div class="px-6 pt-6 pb-5 text-center">
            <button onclick="closeModal('deleteModal')" class="absolute top-4 right-4 text-docu-secondary hover:text-docu-ink transition-colors rounded-docu-btn focus-ring">
                <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M6 18L18 6M6 6l12 12"/></svg>
            </button>
            <div class="w-16 h-16 mx-auto mb-4 bg-docu-danger-light rounded-full flex items-center justify-center">
                <svg class="w-8 h-8 text-docu-danger" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 9v2m0 4h.01m-6.938 4h13.856c1.54 0 2.502-1.667 1.732-2.5L13.732 4.5c-.77-.833-2.694-.833-3.464 0L3.34 16.5c-.77.833.192 2.5 1.732 2.5z"/></svg>
            </div>
            <h3 class="text-h2 text-docu-ink mb-2">삭제 확인</h3>
            <p class="text-sm text-docu-secondary mb-5">정말로 삭제하시겠습니까?</p>
            <div class="bg-surface-sub rounded-docu-btn p-4 text-left mb-4">
                <p class="text-xs text-docu-secondary mb-1">파일명 / 버전</p>
                <div class="flex items-center gap-2">
                    <svg class="w-5 h-5 text-docu-secondary flex-shrink-0" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 12h6m-6 4h6m2 5H7a2 2 0 01-2-2V5a2 2 0 012-2h5.586a1 1 0 01.707.293l5.414 5.414a1 1 0 01.293.707V19a2 2 0 01-2 2z"/></svg>
                    <span id="deleteDocInfo" class="text-sm font-medium text-docu-ink"></span>
                </div>
                <p class="text-xs text-docu-danger mt-2 flex items-center gap-1">
                    <span class="inline-block w-1 h-1 bg-docu-danger rounded-full"></span>
                    삭제된 파일은 복구할 수 없습니다.
                </p>
            </div>
        </div>
        <div class="flex gap-3 px-6 pb-6">
            <button onclick="closeModal('deleteModal')" class="flex-1 btn-ghost py-3">취소</button>
            <button onclick="confirmDelete()" class="flex-1 btn-danger py-3">확인</button>
        </div>
    </div>
</div>

</html>
