<!DOCTYPE html>
<html lang="ko"
      xmlns:th="http://www.thymeleaf.org"
      xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
      layout:decorate="~{common/layout/service-layout}">

<head>
    <title>패치노트</title>
</head>

<body>
<th:block layout:fragment="content">

    <section class="space-y-6">

        <!-- ── 탭 네비게이션 ── -->
        <div class="flex border-b border-divider">
            <a th:href="@{/projects/{publicId}/patch-note(publicId=${publicId})}"
               class="px-5 py-3 text-sm font-medium border-b-2 -mb-px transition-colors border-docu-primary text-docu-primary"
               aria-current="page">
                저장된 패치노트
            </a>
            <a th:href="@{/projects/{publicId}/patch-note/pending-items(publicId=${publicId})}"
               class="px-5 py-3 text-sm font-medium border-b-2 -mb-px transition-colors border-transparent text-docu-secondary hover:text-docu-ink">
                패치노트 작성
            </a>
        </div>

        <!-- ── 페이지 헤더 ── -->
        <div>
            <div th:replace="~{common/fragments/ui-components :: breadcrumb('저장된 패치노트')}"></div>
            <h1 class="text-h1 text-docu-ink mt-3">저장된 패치노트</h1>
            <p class="text-sm text-docu-secondary mt-1">저장된 패치노트를 검색하고 관리합니다.</p>
        </div>

        <!-- ── 필터 + 선택 삭제 ── -->
        <div class="card-base card-shadow p-4">
            <div class="flex flex-wrap items-center gap-3">

                <!-- 키워드 검색 -->
                <div class="relative flex-1 min-w-[200px]">
                    <svg class="absolute left-3 top-1/2 -translate-y-1/2 w-4 h-4 text-docu-tertiary pointer-events-none"
                         fill="none" stroke="currentColor" viewBox="0 0 24 24" aria-hidden="true">
                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
                              d="M21 21l-6-6m2-5a7 7 0 11-14 0 7 7 0 0114 0z"/>
                    </svg>
                    <input id="keywordInput"
                           type="search"
                           placeholder="제목, 버전으로 검색"
                           class="form-input pl-9 w-full"
                           aria-label="키워드 검색"/>
                </div>

                <!-- 시작일 -->
                <input id="dateFrom" type="date"
                       class="form-input w-40" aria-label="시작일"/>

                <!-- 종료일 -->
                <input id="dateTo" type="date"
                       class="form-input w-40" aria-label="종료일"/>

                <!-- 선택 삭제 버튼 (우측 끝) -->
                <div class="ml-auto flex items-center gap-2">
                    <button id="deleteModeBtn"
                            onclick="toggleDeleteMode()"
                            class="btn-secondary"
                            aria-pressed="false">
                        선택 삭제
                    </button>
                    <button id="deleteCancelBtn"
                            onclick="cancelDeleteMode()"
                            class="hidden btn-secondary">
                        취소
                    </button>
                </div>
            </div>
        </div>

        <!-- ── 패치노트 목록 ── -->
        <div class="card-base card-shadow">

            <!-- 테이블 헤더 -->
            <div id="tableHeader"
                 class="grid gap-4 px-6 py-3 bg-surface-subtle border-b border-divider
                        text-xs font-semibold text-docu-secondary uppercase tracking-wide
                        grid-cols-12">
                <!-- checkbox placeholder — hidden by default, shown in delete mode -->
                <div id="headerCheckbox" class="hidden col-span-1 flex justify-center">
                    <input type="checkbox" id="selectAllCheckbox"
                           onchange="toggleSelectAll(this.checked)"
                           class="w-4 h-4 rounded border-divider text-docu-primary cursor-pointer"
                           aria-label="전체 선택"/>
                </div>
                <div id="headerVersion" class="col-span-2">버전</div>
                <div id="headerTitle" class="col-span-6">제목</div>
                <div id="headerDate" class="col-span-3 text-center">저장일시</div>
                <div id="headerAction" class="col-span-1 text-right">작업</div>
            </div>

            <!-- 로딩 -->
            <div id="listLoading" class="py-16 text-center text-docu-secondary text-sm">
                <svg class="w-6 h-6 mx-auto mb-2 animate-spin text-docu-primary" fill="none" viewBox="0 0 24 24">
                    <circle class="opacity-25" cx="12" cy="12" r="10" stroke="currentColor" stroke-width="4"/>
                    <path class="opacity-75" fill="currentColor" d="M4 12a8 8 0 018-8v8H4z"/>
                </svg>
                <p>불러오는 중...</p>
            </div>

            <!-- 목록 (JS 렌더링) -->
            <div id="noteList" class="hidden divide-y divide-divider"></div>

            <!-- 빈 상태 -->
            <div id="listEmpty" class="hidden py-16 text-center text-docu-secondary text-sm">
                <svg class="w-14 h-14 mx-auto mb-4 text-docu-tertiary" fill="none" stroke="currentColor"
                     viewBox="0 0 24 24" aria-hidden="true">
                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="1.5"
                          d="M9 5H7a2 2 0 00-2 2v12a2 2 0 002 2h10a2 2 0 002-2V7a2 2 0 00-2-2h-2
                             M9 5a2 2 0 002 2h2a2 2 0 002-2M9 5a2 2 0 012-2h2a2 2 0 012 2"/>
                </svg>
                <p class="font-medium text-docu-ink mb-1">저장된 패치노트가 없습니다.</p>
                <p class="text-xs">패치노트 작성 탭에서 초안을 생성하고 저장해 보세요.</p>
            </div>

            <!-- 페이지네이션 -->
            <div id="pagination" class="hidden flex items-center justify-between px-6 py-4 border-t border-divider">
                <span id="paginationInfo" class="text-xs text-docu-tertiary"></span>
                <div class="flex items-center gap-1">
                    <button id="prevPageBtn" onclick="changePage(currentPage - 1)"
                            class="px-3 py-1.5 text-xs rounded border border-divider text-docu-secondary
                                   hover:border-docu-primary hover:text-docu-primary transition-colors disabled:opacity-40 disabled:cursor-not-allowed">
                        이전
                    </button>
                    <div id="pageNumbers" class="flex items-center gap-1"></div>
                    <button id="nextPageBtn" onclick="changePage(currentPage + 1)"
                            class="px-3 py-1.5 text-xs rounded border border-divider text-docu-secondary
                                   hover:border-docu-primary hover:text-docu-primary transition-colors disabled:opacity-40 disabled:cursor-not-allowed">
                        다음
                    </button>
                </div>
            </div>

        </div>

    </section>

    <!-- 페이지 메타 -->
    <input type="hidden" id="publicId" th:value="${publicId}"/>

    <!-- ══════════════════════════════════════════════════════════════
         상세 조회 모달
    ══════════════════════════════════════════════════════════════ -->
    <div id="detailModal"
         class="hidden fixed inset-0 z-50 flex items-center justify-center bg-black/40"
         role="dialog" aria-modal="true" aria-labelledby="detailModalTitle"
         onclick="if(event.target===this) closeDetailModal()">
        <div class="card-modal w-full max-w-3xl max-h-[90vh] flex flex-col">

            <!-- 헤더 -->
            <div class="flex items-start justify-between px-8 pt-8 pb-4 border-b border-divider">
                <div class="flex-1 min-w-0 pr-4">
                    <div class="flex items-center gap-2 mb-2">
                        <span id="detailVersionBadge"
                              class="inline-flex items-center px-2.5 py-1 rounded-full text-xs font-bold
                                     bg-docu-primary/10 text-docu-primary"></span>
                        <span id="detailStatusBadge"
                              class="inline-flex items-center px-2 py-0.5 rounded text-xs font-medium
                                     bg-surface-subtle text-docu-secondary"></span>
                    </div>
                    <h2 id="detailModalTitle" class="text-xl font-bold text-docu-ink break-words"></h2>
                    <p id="detailCreatedAt" class="text-xs text-docu-tertiary mt-1"></p>
                </div>
                <button onclick="closeDetailModal()"
                        class="flex-shrink-0 text-docu-secondary hover:text-docu-ink"
                        aria-label="닫기">
                    <svg class="w-6 h-6" fill="none" stroke="currentColor" viewBox="0 0 24 24" aria-hidden="true">
                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
                              d="M6 18L18 6M6 6l12 12"/>
                    </svg>
                </button>
            </div>

            <!-- 본문 (markdown 렌더링) -->
            <div class="flex-1 overflow-y-auto px-8 py-6">
                <div id="detailLoading" class="py-8 text-center text-docu-secondary text-sm">
                    <svg class="w-5 h-5 mx-auto mb-2 animate-spin text-docu-primary" fill="none" viewBox="0 0 24 24">
                        <circle class="opacity-25" cx="12" cy="12" r="10" stroke="currentColor" stroke-width="4"/>
                        <path class="opacity-75" fill="currentColor" d="M4 12a8 8 0 018-8v8H4z"/>
                    </svg>
                    <p>불러오는 중...</p>
                </div>
                <div id="detailContent"
                     class="hidden prose prose-sm max-w-none
                            prose-headings:text-docu-ink prose-headings:font-bold
                            prose-p:text-docu-secondary prose-li:text-docu-secondary
                            prose-strong:text-docu-ink prose-code:text-docu-primary">
                </div>
            </div>

            <!-- 하단 버튼 -->
            <div class="flex items-center justify-between px-8 py-5 border-t border-divider bg-surface-subtle">
                <button onclick="copyDetailContent()"
                        class="inline-flex items-center gap-2 btn-secondary text-sm">
                    <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24" aria-hidden="true">
                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
                              d="M8 16H6a2 2 0 01-2-2V6a2 2 0 012-2h8a2 2 0 012 2v2m-6 12h8a2 2 0 002-2v-8a2 2 0 00-2-2h-8a2 2 0 00-2 2v8a2 2 0 002 2z"/>
                    </svg>
                    복사
                </button>
                <div class="flex items-center gap-3">
                    <button id="detailDeleteBtn"
                            onclick="openDeleteModal(currentDetailId)"
                            class="btn-danger text-sm">
                        삭제
                    </button>
                    <button onclick="closeDetailModal()" class="btn-secondary text-sm">닫기</button>
                </div>
            </div>
        </div>
    </div>

    <!-- ══════════════════════════════════════════════════════════════
         단건 삭제 확인 모달
    ══════════════════════════════════════════════════════════════ -->
    <div id="deleteModal"
         class="hidden fixed inset-0 z-50 flex items-center justify-center bg-black/40"
         role="dialog" aria-modal="true" aria-labelledby="deleteModalTitle"
         onclick="if(event.target===this) closeDeleteModal()">
        <div class="card-modal w-full max-w-md">
            <div class="flex items-center gap-3 px-8 pt-8 pb-4">
                <div class="w-10 h-10 bg-red-100 rounded-full flex items-center justify-center" aria-hidden="true">
                    <svg class="w-5 h-5 text-red-600" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
                              d="M19 7l-.867 12.142A2 2 0 0116.138 21H7.862a2 2 0 01-1.995-1.858L5 7m5 4v6m4-6v6m1-10V4a1 1 0 00-1-1h-4a1 1 0 00-1 1v3M4 7h16"/>
                    </svg>
                </div>
                <h2 id="deleteModalTitle" class="text-xl font-bold text-docu-ink">패치노트 삭제</h2>
            </div>
            <div class="px-8 pb-4">
                <p class="text-sm text-docu-secondary">이 패치노트를 삭제하시겠습니까? 삭제 후에는 복구할 수 없습니다.</p>
            </div>
            <div class="flex items-center justify-end gap-3 px-8 py-5 border-t border-divider">
                <button onclick="closeDeleteModal()" class="btn-secondary">취소</button>
                <button onclick="confirmDelete()" class="btn-danger">삭제</button>
            </div>
        </div>
    </div>

    <!-- ══════════════════════════════════════════════════════════════
         일괄 삭제 확인 모달
    ══════════════════════════════════════════════════════════════ -->
    <div id="bulkDeleteModal"
         class="hidden fixed inset-0 z-50 flex items-center justify-center bg-black/40"
         role="dialog" aria-modal="true" aria-labelledby="bulkDeleteModalTitle"
         onclick="if(event.target===this) closeBulkDeleteModal()">
        <div class="card-modal w-full max-w-md">
            <div class="flex items-center gap-3 px-8 pt-8 pb-4">
                <div class="w-10 h-10 bg-red-100 rounded-full flex items-center justify-center" aria-hidden="true">
                    <svg class="w-5 h-5 text-red-600" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
                              d="M19 7l-.867 12.142A2 2 0 0116.138 21H7.862a2 2 0 01-1.995-1.858L5 7m5 4v6m4-6v6m1-10V4a1 1 0 00-1-1h-4a1 1 0 00-1 1v3M4 7h16"/>
                    </svg>
                </div>
                <h2 id="bulkDeleteModalTitle" class="text-xl font-bold text-docu-ink">선택 항목 삭제</h2>
            </div>
            <div class="px-8 pb-4">
                <p id="bulkDeleteDesc" class="text-sm text-docu-secondary"></p>
            </div>
            <div class="flex items-center justify-end gap-3 px-8 py-5 border-t border-divider">
                <button onclick="closeBulkDeleteModal()" class="btn-secondary">취소</button>
                <button onclick="confirmBulkDelete()" class="btn-danger">삭제</button>
            </div>
        </div>
    </div>

</th:block>

<th:block layout:fragment="scripts">
    <script src="https://cdn.jsdelivr.net/npm/marked@9.1.6/marked.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/dompurify@3.0.6/dist/purify.min.js"></script>
    <script th:src="@{/js/patchnote/patch-note-list.js}"></script>
</th:block>
</body>
</html>
