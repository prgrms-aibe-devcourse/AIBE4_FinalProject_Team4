<!DOCTYPE html>
<html lang="ko"
      xmlns:th="http://www.thymeleaf.org"
      xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
      layout:decorate="~{common/layout/service-layout}">

<head>
    <title>이슈 상세 분석</title>
</head>

<body>
<th:block layout:fragment="content">

    <section class="space-y-6">
        <!-- 상단 헤더 -->
        <div>
            <!-- Breadcrumb (동적 링크 업데이트 필요) -->
            <nav aria-label="Breadcrumb" class="flex items-center gap-2 text-sm text-docu-secondary flex-wrap">
                <a id="breadcrumbBackLink"
                   th:href="@{/projects/{publicId}/issues(publicId=${publicId})}"
                   class="nav-link-base hover:text-docu-ink">이슈</a>
                <span aria-hidden="true">/</span>
                <span id="issueIdBreadcrumb" class="font-semibold text-docu-ink">
                    이슈 #<span th:text="${issueId}"></span>
                </span>
            </nav>

            <!-- 이슈 헤더 -->
            <div class="flex items-start justify-between mt-3">
                <div class="flex-1">
                    <div class="flex items-center gap-3 mb-2">
                        <span id="statusBadge"></span>
                        <span class="text-xs text-docu-tertiary">ID: <span th:text="${issueId}"></span></span>
                    </div>
                    <h1 id="issueTitle" class="text-h1 text-docu-ink mb-2"></h1>
                    <p id="sourceLocation" class="text-sm text-docu-secondary font-mono"></p>
                </div>
                <div class="flex items-center gap-3">
                    <button onclick="shareIssue()" class="btn-secondary">
                        <svg class="w-4 h-4 inline mr-1" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M8.684 13.342C8.886 12.938 9 12.482 9 12c0-.482-.114-.938-.316-1.342m0 2.684a3 3 0 110-2.684m0 2.684l6.632 3.316m-6.632-6l6.632-3.316m0 0a3 3 0 105.367-2.684 3 3 0 00-5.367 2.684zm0 9.316a3 3 0 105.368 2.684 3 3 0 00-5.368-2.684z"/>
                        </svg>
                        공유
                    </button>
                    <button onclick="openStatusModal()" class="btn-primary">
                        상태 변경
                    </button>
                </div>
            </div>
        </div>

        <!-- 메인 레이아웃 (3:1 비율) -->
        <div class="grid grid-cols-4 gap-6">
            <!-- 왼쪽 메인 영역 (3/4) -->
            <div class="col-span-3 space-y-6">

                <!-- Overview 섹션 -->
                <div class="grid grid-cols-2 gap-6">
                    <!-- 심각도 분석 -->
                    <div class="card-base card-shadow p-widget-p">
                        <h2 class="text-lg font-bold text-docu-ink mb-4">심각도 분석</h2>
                        <div id="severityAnalysis"></div>
                    </div>

                    <!-- 요약 -->
                    <div class="card-base card-shadow p-widget-p">
                        <h2 class="text-lg font-bold text-docu-ink mb-4">요약</h2>
                        <div id="groupingInfo"></div>
                    </div>
                </div>

                <!-- 발생 추이 -->
                <div class="card-base card-shadow p-widget-p">
                    <div class="flex items-center justify-between mb-4">
                        <h2 class="text-lg font-bold text-docu-ink">발생 추이</h2>
                        <div class="flex items-center gap-2">
                            <button onclick="setTimeRange('7d')" data-range="7d" class="time-range-btn px-3 py-1.5 text-xs font-medium rounded-lg border-docu-primary text-docu-primary">7일</button>
                            <button onclick="setTimeRange('30d')" data-range="30d" class="time-range-btn px-3 py-1.5 text-xs font-medium rounded-lg border-transparent text-docu-secondary">30일</button>
                            <button onclick="setTimeRange('all')" data-range="all" class="time-range-btn px-3 py-1.5 text-xs font-medium rounded-lg border-transparent text-docu-secondary">전체</button>
                        </div>
                    </div>
                    <div id="occurrenceTrend" class="h-64">
                        <!-- 차트가 여기에 렌더링됩니다 (Chart.js 사용) -->
                        <canvas id="trendChart"></canvas>
                    </div>
                </div>

                <!-- 분포 분석 -->
                <div class="card-base card-shadow p-widget-p">
                    <h2 class="text-lg font-bold text-docu-ink mb-4">분포 분석</h2>
                    <div id="distributionAnalysis">
                        <!-- 분포 분석 차트가 여기에 렌더링됩니다 -->
                    </div>
                </div>

                <!-- 발생 맥락 -->
                <div class="card-base card-shadow p-widget-p">
                    <h2 class="text-lg font-bold text-docu-ink mb-4">📋 발생 맥락</h2>
                    <div id="issueContext">
                        <!-- 맥락 정보가 여기에 렌더링됩니다 -->
                        <p class="text-sm text-docu-tertiary">맥락 정보를 불러오는 중...</p>
                    </div>
                </div>

                <!-- 근본 원인 분석 -->
                <div class="card-base card-shadow p-widget-p">
                    <h2 class="text-lg font-bold text-docu-ink mb-4">🔍 근본 원인 분석</h2>
                    <div id="rootCauseAnalysis">
                        <!-- 근본 원인 분석 결과가 여기에 렌더링됩니다 -->
                    </div>
                </div>

                <!-- 로그 상세 -->
                <div class="card-base card-shadow p-widget-p">
                    <h2 class="text-lg font-bold text-docu-ink mb-4">로그 상세</h2>
                    <div id="logDetails">
                        <!-- 스택트레이스 및 아카이브 내용 -->
                    </div>
                </div>

                <!-- 영향 받은 플레이어 -->
                <div class="card-base card-shadow p-widget-p">
                    <h2 class="text-lg font-bold text-docu-ink mb-4">영향 받은 플레이어</h2>
                    <div id="affectedPlayers">
                        <!-- Phase 4에서 구현 -->
                        <div class="text-center text-docu-tertiary text-sm py-8">
                            플레이어 데이터를 불러오는 중...
                        </div>
                    </div>
                </div>

            </div>

            <!-- 오른쪽 사이드바 (1/4) -->
            <div class="col-span-1 space-y-6">

                <!-- 메타 정보 -->
                <div class="card-base card-shadow p-widget-p">
                    <h3 class="text-sm font-bold text-docu-ink mb-4">메타 정보</h3>
                    <div id="metaInfo" class="space-y-3 text-sm">
                        <!-- 담당자 -->
                        <div>
                            <label class="block text-xs font-semibold text-docu-secondary mb-2">담당자</label>

                            <!-- 표시 모드 -->
                            <div id="assigneeDisplay" class="cursor-pointer hover:bg-surface-hover p-2 rounded-lg transition-colors" onclick="enterAssigneeEditMode()">
                                <div id="assigneeInfo" class="flex items-center gap-2">
                                    <!-- 담당자 정보가 여기에 렌더링됩니다 -->
                                    <div class="flex items-center gap-2 text-docu-tertiary text-xs">
                                        <div class="w-8 h-8 bg-surface-tertiary rounded-full flex items-center justify-center text-docu-secondary">
                                            <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                                                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M16 7a4 4 0 11-8 0 4 4 0 018 0zM12 14a7 7 0 00-7 7h14a7 7 0 00-7-7z"/>
                                            </svg>
                                        </div>
                                        <span>담당자 없음</span>
                                    </div>
                                </div>
                            </div>

                            <!-- 편집 모드 -->
                            <div id="assigneeEdit" class="hidden">
                                <select id="assigneeSelect" class="form-select mb-2">
                                    <option value="">선택하세요</option>
                                </select>
                                <div class="flex gap-2">
                                    <button onclick="saveAssigneeChange()" class="flex-1 btn-primary text-xs py-1.5">
                                        ✓ 저장
                                    </button>
                                    <button onclick="cancelAssigneeEdit()" class="flex-1 btn-secondary text-xs py-1.5">
                                        ✕ 취소
                                    </button>
                                </div>
                                <div id="assigneeEditError" class="hidden mt-2 p-2 bg-surface-secondary border border-divider rounded text-xs text-docu-danger"></div>
                            </div>
                        </div>

                        <!-- 우선순위 -->
                        <div>
                            <label class="block text-xs font-semibold text-docu-secondary mb-2">우선순위</label>

                            <!-- 표시 모드 -->
                            <div id="priorityDisplay" class="cursor-pointer hover:bg-surface-hover p-2 rounded-lg transition-colors" onclick="enterPriorityEditMode()">
                                <div id="priorityInfo" class="text-docu-ink">
                                    <span class="text-xs text-docu-tertiary">미설정</span>
                                </div>
                            </div>

                            <!-- 편집 모드 -->
                            <div id="priorityEdit" class="hidden">
                                <select id="prioritySelect" class="form-select mb-2">
                                    <option value="">선택하세요</option>
                                    <option value="P1">P1 긴급</option>
                                    <option value="P2">P2 높음</option>
                                    <option value="P3">P3 보통</option>
                                    <option value="P4">P4 낮음</option>
                                </select>
                                <div class="flex gap-2">
                                    <button onclick="savePriorityChange()" class="flex-1 btn-primary text-xs py-1.5">
                                        ✓ 저장
                                    </button>
                                    <button onclick="cancelPriorityEdit()" class="flex-1 btn-secondary text-xs py-1.5">
                                        ✕ 취소
                                    </button>
                                </div>
                                <div id="priorityEditError" class="hidden mt-2 p-2 bg-surface-secondary border border-divider rounded text-xs text-docu-danger"></div>
                            </div>
                        </div>

                        <div>
                            <label class="block text-xs font-semibold text-docu-secondary mb-1">발생 횟수</label>
                            <p id="occurrenceCount" class="text-docu-ink font-medium">-</p>
                        </div>
                        <div>
                            <label class="block text-xs font-semibold text-docu-secondary mb-1">최초 발생</label>
                            <p id="firstOccurred" class="text-xs text-docu-secondary">-</p>
                        </div>
                        <div>
                            <label class="block text-xs font-semibold text-docu-secondary mb-1">최근 발생</label>
                            <p id="lastOccurred" class="text-xs text-docu-secondary">-</p>
                        </div>
                    </div>
                </div>

                <!-- 관련 이슈 -->
                <div class="card-base card-shadow p-widget-p">
                    <h3 class="text-sm font-bold text-docu-ink mb-4">관련 이슈</h3>
                    <div id="relatedIssues" class="space-y-2">
                        <!-- 유사 이슈 목록 -->
                    </div>
                </div>

                <!-- 타임라인 -->
                <div class="card-base card-shadow p-widget-p">
                    <h3 class="text-sm font-bold text-docu-ink mb-4">타임라인</h3>
                    <div id="timeline" class="space-y-4">
                        <!-- Timeline items -->
                    </div>
                </div>

            </div>
        </div>

        <!-- 페이지 메타 정보 (JS에서 사용) -->
        <input type="hidden" id="publicId" th:value="${publicId}">
        <input type="hidden" id="projectId" th:value="${projectId}">
        <input type="hidden" id="issueId" th:value="${issueId}">

        <!-- 댓글 섹션 -->
        <div class="card-base card-shadow p-widget-p">
            <h3 class="text-h3 text-docu-ink mb-4">댓글 <span id="commentCount" class="text-docu-tertiary">(0)</span></h3>

            <!-- 댓글 목록 -->
            <div id="commentList" class="space-y-4 mb-4">
                <p class="text-sm text-docu-tertiary text-center py-4">댓글이 없습니다.</p>
            </div>

            <!-- 페이지네이션 -->
            <div id="commentPagination" class="hidden flex items-center justify-center gap-2 mb-4">
                <button onclick="loadComments(currentPage - 1)" id="prevPage" class="btn-secondary text-xs px-3 py-1">
                    이전
                </button>
                <span id="pageInfo" class="text-sm text-docu-secondary"></span>
                <button onclick="loadComments(currentPage + 1)" id="nextPage" class="btn-secondary text-xs px-3 py-1">
                    다음
                </button>
            </div>

            <!-- 댓글 작성 폼 -->
            <div class="relative">
                <textarea id="commentInput" placeholder="댓글을 입력하세요... (@닉네임으로 멘션 가능)"
                          class="form-input w-full resize-none"
                          rows="3"></textarea>

                <!-- 멘션 자동완성 드롭다운 (Slack 스타일 - 커서 위치에 표시) -->
                <div id="mentionDropdown" class="hidden absolute bg-white border border-gray-200 rounded-lg shadow-xl max-h-64 overflow-y-auto z-20 py-1">
                    <!-- 멤버 목록이 여기에 렌더링됩니다 -->
                </div>

                <div class="flex items-center justify-between mt-2">
                    <span id="mentionedMembersPreview" class="text-sm text-docu-tertiary"></span>
                    <button onclick="submitComment()" class="btn-primary">
                        댓글 작성
                    </button>
                </div>
            </div>
        </div>

    </section>

    <!-- ==================== 상태 변경 모달 ==================== -->
    <div id="statusModal" class="hidden fixed inset-0 z-50 flex items-center justify-center bg-black/40" onclick="if(event.target === this) closeModal('statusModal')">
        <div class="card-modal w-full max-w-md">
        <!-- 헤더 -->
        <div class="flex items-center justify-between px-8 pt-8 pb-4">
                <h2 class="text-xl font-bold text-docu-ink">상태 변경</h2>
                <button onclick="closeModal('statusModal')" class="text-docu-tertiary hover:text-docu-secondary">
                    <svg class="w-6 h-6" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M6 18L18 6M6 6l12 12"/></svg>
                </button>
        </div>
        <!-- 본문 -->
        <div class="px-8 pb-4">
                <div id="statusError" class="hidden mb-4 p-3 bg-surface-secondary border border-divider rounded-lg text-sm text-docu-danger"></div>
                <div class="mb-5">
                    <label class="block text-sm font-semibold text-docu-ink mb-2">변경할 상태 <span class="text-docu-danger">*</span></label>
                    <select id="newStatus" class="form-select">
                        <option value="">선택하세요</option>
                        <option value="TODO">대기중</option>
                        <option value="IN_PROGRESS">처리중</option>
                        <option value="RESOLVED">해결됨</option>
                    </select>
                </div>

                <!-- 해결됨 선택 시 표시되는 옵션 -->
                <div id="resolvedOptions" class="hidden space-y-4">
                    <!-- 해결 방법 설명 -->
                    <div>
                        <label class="block text-sm font-semibold text-docu-ink mb-2">해결 방법 (선택)</label>
                        <textarea id="resolutionNote" rows="4"
                                  class="form-textarea resize-none"
                                  placeholder="이슈를 어떻게 해결했는지 설명하세요 (선택사항)"></textarea>
                        <p class="text-xs text-docu-secondary mt-1">예: 사용자 프로필 조회 전 null 체크 로직 추가</p>
                    </div>

                    <!-- 패치노트 포함 옵션 -->
                    <div class="flex items-start gap-3 p-4 bg-surface-secondary border border-divider rounded-lg">
                        <input type="checkbox" id="shouldIncludeInPatchNote" class="mt-0.5 w-4 h-4 rounded border-divider text-docu-primary focus:ring-docu-primary">
                        <div class="flex-1">
                            <label for="shouldIncludeInPatchNote" class="text-sm font-semibold text-docu-ink cursor-pointer">패치노트에 포함</label>
                            <p class="text-xs text-docu-secondary mt-0.5">해결된 이슈를 패치노트에 반영합니다.</p>
                        </div>
                    </div>
                </div>
        </div>
            <!-- 하단 버튼 -->
            <div class="flex items-center justify-end gap-3 px-8 py-5 border-t border-divider">
                <button onclick="closeModal('statusModal')" class="btn-secondary">취소</button>
                <button onclick="submitStatusChange()" class="btn-primary">변경</button>
            </div>
        </div>
    </div>

</th:block>

<th:block layout:fragment="scripts">
    <script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.0/dist/chart.umd.min.js"></script>
    <script th:src="@{/js/issue/issue-analysis.js}"></script>
    <script th:src="@{/js/issue/issue-comment.js}"></script>
</th:block>
</body>
</html>
