<!DOCTYPE html>
<html lang="ko"
      xmlns:th="http://www.thymeleaf.org"
      xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
      layout:decorate="~{common/layouts/base-layout}">
<!--
  ╔═══════════════════════════════════════════════════════════════════════╗
  ║  mypage-layout.html  ·  Level 2 마이페이지 전용 레이아웃             ║
  ║                                                                       ║
  ║  구조 (L-Shape):                                                      ║
  ║  ┌─────────────────┬──────────────────────────────────────────────┐  ║
  ║  │  Sidebar        │  user-bar (h-16, static, bg-surface-card)    │  ║
  ║  │  mypage         ├──────────────────────────────────────────────┤  ║
  ║  │  fixed          │  <main>                                      │  ║
  ║  │  w-[240px]      │  pl-[240px]  bg-surface-base                 │  ║
  ║  │  h-full  z-40   │  p-content-p                                 │  ║
  ║  │  bg-surface-    │                                              │  ║
  ║  │    sidebar      │  layout:fragment="content" ← 도메인 페이지   │  ║
  ║  └─────────────────┴──────────────────────────────────────────────┘  ║
  ║                                                                       ║
  ║  service-layout 과의 차이:                                            ║
  ║    · 헤더가 fixed 가 아닌 user-bar (static, 스크롤과 함께)            ║
  ║    · pt-16 오프셋 불필요                                              ║
  ║    · sidebar-mypage.html 사용 (프로젝트 셀렉터 없음)                  ║
  ║                                                                       ║
  ║  컨트롤러 필수 Model 속성:                                            ║
  ║    pageTitle   (String) 탭 타이틀                                     ║
  ║    activeMenu  (String) profile | company | projects                  ║
  ║    headerInfo  (Dto)    유저/회사 정보                                 ║
  ║                                                                       ║
  ║  사용법 (마이페이지 도메인):                                          ║
  ║    layout:decorate="~{common/layouts/mypage-layout}"                  ║
  ║    <div layout:fragment="content"> ... </div>                         ║
  ╚═══════════════════════════════════════════════════════════════════════╝
-->
<body>
<layout:fragment name="body">

    <!-- ══════════════════════════════════════════════════
         마이페이지 전용 고정 사이드바
         w-[240px] / fixed / z-40 / bg-surface-sidebar
         파라미터: (activeMenu)
         ══════════════════════════════════════════════════ -->
    <div th:replace="~{common/fragments/sidebar-mypage :: sidebar-mypage(${activeMenu})}"></div>

    <!--
      ── 사이드바 오른쪽 전체 영역 ────────────────────────────
      pl-[240px] : 고정 사이드바(240px) 오른쪽으로 밀기
      pt-16은 불필요 (user-bar 는 static 이므로 자연 흐름)
      ────────────────────────────────────────────────────── -->
    <div class="pl-[240px] min-h-screen flex flex-col bg-surface-base">

        <!--
          유저 정보 바 (h-16, static — 스크롤과 함께 움직임)
          · 이름/역할/프로필/로그아웃 포함
          · sticky top-0 으로 바꾸면 스티키 헤더로 전환 가능
        -->
        <div th:replace="~{common/fragments/header-auth :: user-bar}"></div>

        <!-- 스크롤 가능한 메인 콘텐츠 -->
        <main class="flex-1 p-content-p overflow-y-auto">
            <!--
              마이페이지 도메인이 채우는 콘텐츠 슬롯
              사용 예)
                <div layout:fragment="content">
                    <h1 class="text-h1">내 프로필</h1>
                </div>
            -->
            <layout:fragment name="content">
                <!-- fallback: 도메인 페이지에서 반드시 오버라이드 -->
            </layout:fragment>
        </main>

        <!-- 푸터 -->
        <footer class="shrink-0 py-4 px-content-p border-t border-divider">
            <p class="text-xs text-gray-400 text-center">
                © 2026 Documind Incs. All rights reserved.
            </p>
        </footer>

    </div>

    <!-- 로그아웃 확인 모달 -->
    <div th:replace="~{common/fragments/header-auth :: logout-modal}"></div>

    <!-- 로그아웃 모달 JS 바인딩 -->
    <div th:replace="~{common/fragments/header-auth :: logout-script}"></div>

</layout:fragment>
</body>
</html>
