<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<div th:fragment="top-toast">
    <!-- 상단 토스트 메시지 컨테이너 -->
    <div id="top-toast-container"
         class="fixed top-0 left-0 right-0 z-[60] flex justify-center px-2 sm:px-4 transition-transform duration-500 -translate-y-full pointer-events-none">
        <div id="top-toast-message"
             role="status"
             aria-live="polite"
             aria-atomic="true"
             class="top-toast-base top-toast-info mt-4 w-full sm:min-w-[320px] sm:max-w-[640px] pointer-events-auto">
            <!-- 아이콘 -->
            <span id="top-toast-icon-wrap"
                  class="top-toast-icon-wrap top-toast-icon-info">
                <svg id="top-toast-icon"
                     class="w-4 h-4"
                     fill="none"
                     stroke="currentColor"
                     stroke-width="2.2"
                     viewBox="0 0 24 24"
                     aria-hidden="true">
                    <path d="M13 16h-1v-4h-1m1-4h.01"></path>
                    <circle cx="12" cy="12" r="9"></circle>
                </svg>
            </span>

            <!-- 메시지 텍스트 -->
            <span id="top-toast-text"
                  class="text-sm font-semibold flex-1">
                알림 메시지
            </span>
        </div>
    </div>

    <script th:inline="javascript">
        /*<![CDATA[*/
        let _toastHideTimer = null;

        document.addEventListener('DOMContentLoaded', () => {
            const flashMsg = /*[[${topToast}]]*/ null;
            if (flashMsg) {
                showTopToast(flashMsg, 'info');
                return;
            }

            const params = new URLSearchParams(window.location.search);
            const toastParam = params.get('toast_message');

            const roleMessages = {
                role_mismatch_ceo: '관리자(CEO) 계정으로 로그인되었습니다.',
                role_mismatch_employee: '일반 직원 계정으로 로그인되었습니다.',
                role_mismatch: '선택하신 역할과 다른 계정으로 로그인되었습니다.',
            };

            if (toastParam) {
                const message = roleMessages[toastParam] ?? toastParam;
                showTopToast(message, 'warning');

                params.delete('toast_message');
                const nextQuery = params.toString();
                const newUrl = window.location.pathname + (nextQuery ? '?' + nextQuery : '');
                window.history.replaceState({}, '', newUrl);
            }
        });

        function setTopToastStyle(type = 'info') {
            const messageBox = document.getElementById('top-toast-message');
            const iconWrap = document.getElementById('top-toast-icon-wrap');
            const icon = document.getElementById('top-toast-icon');
            if (!messageBox || !iconWrap || !icon) return;

            const messageVariantClasses = [
                'top-toast-info',
                'top-toast-success',
                'top-toast-warning',
                'top-toast-danger'
            ];

            const iconVariantClasses = [
                'top-toast-icon-info',
                'top-toast-icon-success',
                'top-toast-icon-warning',
                'top-toast-icon-danger'
            ];

            messageBox.classList.remove(...messageVariantClasses);
            iconWrap.classList.remove(...iconVariantClasses);

            if (type === 'success') {
                messageBox.classList.add('top-toast-success');
                iconWrap.classList.add('top-toast-icon-success');
                icon.innerHTML = '<path d="M5 13l4 4L19 7"></path>';
            } else if (type === 'warning') {
                messageBox.classList.add('top-toast-warning');
                iconWrap.classList.add('top-toast-icon-warning');
                icon.innerHTML =
                    '<path d="M12 9v3m0 4h.01"></path>' +
                    '<path d="M10.29 3.86L1.82 18a2 2 0 001.71 3h16.94a2 2 0 001.71-3L13.71 3.86a2 2 0 00-3.42 0z"></path>';
            } else if (type === 'danger') {
                messageBox.classList.add('top-toast-danger');
                iconWrap.classList.add('top-toast-icon-danger');
                icon.innerHTML =
                    '<path d="M12 9v3m0 4h.01"></path>' +
                    '<path d="M10.29 3.86L1.82 18a2 2 0 001.71 3h16.94a2 2 0 001.71-3L13.71 3.86a2 2 0 00-3.42 0z"></path>';
            } else {
                messageBox.classList.add('top-toast-info');
                iconWrap.classList.add('top-toast-icon-info');
                icon.innerHTML =
                    '<path d="M13 16h-1v-4h-1m1-4h.01"></path>' +
                    '<circle cx="12" cy="12" r="9"></circle>';
            }
        }

        function showTopToast(message, type = 'info', displayDuration = 4000) {
            const container = document.getElementById('top-toast-container');
            const textSpan = document.getElementById('top-toast-text');
            if (!container || !textSpan) return;

            if (_toastHideTimer !== null) {
                clearTimeout(_toastHideTimer);
                _toastHideTimer = null;
            }

            setTopToastStyle(type);
            textSpan.textContent = message;

            container.classList.add('-translate-y-full');

            requestAnimationFrame(() => {
                requestAnimationFrame(() => {
                    container.classList.remove('-translate-y-full');

                    _toastHideTimer = setTimeout(() => {
                        requestAnimationFrame(() => {
                            container.classList.add('-translate-y-full');
                        });
                        _toastHideTimer = null;
                    }, displayDuration);
                });
            });
        }

        window.showTopToast = showTopToast;
        /*]]>*/
    </script>
</div>
</html>
