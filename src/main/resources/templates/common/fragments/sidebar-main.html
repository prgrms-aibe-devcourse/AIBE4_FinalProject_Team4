<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<body>

<aside th:fragment="sidebar(activeMenu, activeProject)"
       class="fixed top-0 left-0 h-full w-[240px] bg-surface-sidebar border-r border-divider
              z-40 flex flex-col overflow-hidden">

    <!-- 로고 -->
    <div class="h-16 flex items-center px-4 bg-surface-sidebar shrink-0">
        <a href="/member/dashboard" class="flex items-center gap-2 select-none">
            <img src="/images/logo.png" alt="DOCUMIND" class="h-8 w-auto object-contain">
        </a>
    </div>

    <!-- 소속 회사 정보 -->
    <div th:if="${headerInfo != null and headerInfo.globalRole() != null
                  and headerInfo.globalRole().name() != 'ADMIN'}"
         class="px-4 py-3 shrink-0">

        <div th:if="${headerInfo.companyName() != null}"
             class="flex items-center gap-3">
            <div th:if="${headerInfo.companyProfileUrl() != null}"
                 class="w-9 h-9 rounded-full overflow-hidden shrink-0">
                <img th:src="${headerInfo.companyProfileUrl()}"
                     alt="회사 프로필"
                     class="w-full h-full object-cover"/>
            </div>

            <div th:unless="${headerInfo.companyProfileUrl() != null}"
                 class="w-9 h-9 rounded-full bg-docu-primary flex items-center justify-center shrink-0">
                <span th:text="${#strings.substring(headerInfo.companyName(),0,1)}"
                      class="text-white text-sm font-bold"></span>
            </div>

            <div class="flex flex-col min-w-0">
                <span th:text="${headerInfo.companyName()}"
                      class="text-sm font-semibold text-docu-ink truncate"></span>
                <span class="text-xs text-docu-secondary">내 회사</span>
            </div>
        </div>

        <div th:unless="${headerInfo.companyName() != null}"
             class="flex items-center gap-3">
            <div class="w-9 h-9 rounded-full bg-surface-base flex items-center justify-center shrink-0 border border-divider">
                <svg class="w-4 h-4 text-docu-secondary" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
                          d="M19 21V5a2 2 0 00-2-2H7a2 2 0 00-2 2v16m14 0h2m-2 0h-5
                             m-9 0H3m2 0h5M9 7h1m-1 4h1m4-4h1m-1 4h1"/>
                </svg>
            </div>
            <span class="text-sm text-docu-secondary">소속 없음</span>
        </div>
    </div>

    <!-- 프로젝트 셀렉터 -->
    <div class="px-3 py-3 shrink-0">
        <div class="relative">
            <button id="project-selector-btn"
                    class="w-full flex items-center justify-between gap-2
                           px-3 py-2.5 rounded-docu-btn border border-divider
                           bg-surface-card hover:bg-white transition-colors text-left shadow-docu-sm">
                <div class="flex items-center gap-2.5 min-w-0">
                    <span id="project-color-dot"
                          class="w-2.5 h-2.5 rounded-full shrink-0 bg-docu-primary"></span>
                    <span id="project-name-label"
                          th:text="${currentProjectName ?: '프로젝트 선택'}"
                          class="text-sm font-medium text-docu-ink truncate">프로젝트 선택</span>
                </div>
                <svg class="w-4 h-4 text-docu-secondary shrink-0 transition-transform duration-200"
                     id="project-selector-chevron"
                     fill="none" stroke="currentColor" viewBox="0 0 24 24">
                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
                          d="M19 9l-7 7-7-7"/>
                </svg>
            </button>

            <div id="project-dropdown"
                 class="hidden absolute top-full left-0 right-0 mt-1 bg-white
                        border border-divider rounded-docu-btn shadow-docu-card z-50 overflow-hidden
                        max-h-56 overflow-y-auto">

                <div th:if="${projectList != null and not #lists.isEmpty(projectList)}">
                    <a th:each="proj : ${projectList}"
                       th:href="@{/projects/{id}/dashboard(id=${proj.publicId()})}"
                       th:classappend="${proj.publicId() == activeProject} ?
                                       'bg-docu-primary text-white' :
                                       'text-docu-ink hover:bg-surface-base'"
                       class="flex items-center gap-2.5 px-3 py-2.5 text-sm transition-colors">
                        <span th:classappend="${proj.publicId() == activeProject} ? 'bg-white opacity-80' : 'bg-docu-primary'"
                              class="w-2.5 h-2.5 rounded-full shrink-0"></span>
                        <span th:text="${proj.name()}" class="truncate"></span>
                        <svg th:if="${proj.publicId() == activeProject}"
                             class="w-4 h-4 ml-auto shrink-0"
                             fill="none" stroke="currentColor" viewBox="0 0 24 24">
                            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
                                  d="M5 13l4 4L19 7"/>
                        </svg>
                    </a>
                </div>

                <div th:if="${projectList == null or #lists.isEmpty(projectList)}"
                     class="px-3 py-4 text-center text-sm text-docu-secondary">
                    참여 중인 프로젝트가 없습니다
                </div>

                <div class="border-t border-divider">
                    <a href="/projects/new"
                       class="flex items-center gap-2 px-3 py-2.5 text-sm text-docu-primary
                              hover:bg-surface-base transition-colors font-medium">
                        <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
                                  d="M12 4v16m8-8H4"/>
                        </svg>
                        새 프로젝트 만들기
                    </a>
                </div>
            </div>
        </div>
    </div>

    <!-- 내비게이션 -->
    <nav class="flex-1 flex flex-col gap-1 p-3 overflow-y-auto">

        <a th:href="${activeProject != null} ? @{/projects/{id}/documents(id=${activeProject})} : '#'"
           th:classappend="${activeMenu == 'documents'} ?
                           'bg-docu-primary text-white shadow-docu-sm' :
                           'text-docu-secondary hover:bg-surface-base hover:text-docu-ink'"
           class="flex items-center gap-3 px-3 py-2.5 rounded-docu-btn text-sm font-medium transition-colors">
            <span>문서</span>
        </a>

        <a th:href="${activeProject != null} ? @{/projects/{id}/chatbot(id=${activeProject})} : '#'"
           th:classappend="${activeMenu == 'chatbot'} ?
                           'bg-docu-primary text-white shadow-docu-sm' :
                           'text-docu-secondary hover:bg-surface-base hover:text-docu-ink'"
           class="flex items-center gap-3 px-3 py-2.5 rounded-docu-btn text-sm font-medium transition-colors">
            <span>챗봇</span>
        </a>

        <a th:href="${activeProject != null} ? @{/projects/{id}/dashboard(id=${activeProject})} : '/member/dashboard'"
           th:classappend="${activeMenu == 'dashboard'} ?
                           'bg-docu-primary text-white shadow-docu-sm' :
                           'text-docu-secondary hover:bg-surface-base hover:text-docu-ink'"
           class="flex items-center gap-3 px-3 py-2.5 rounded-docu-btn text-sm font-medium transition-colors">
            <span>대시보드</span>
        </a>

        <a th:href="${activeProject != null} ? @{/projects/{id}/logs(id=${activeProject})} : '#'"
           th:classappend="${activeMenu == 'logs'} ?
                           'bg-docu-primary text-white shadow-docu-sm' :
                           'text-docu-secondary hover:bg-surface-base hover:text-docu-ink'"
           class="flex items-center gap-3 px-3 py-2.5 rounded-docu-btn text-sm font-medium transition-colors">
            <span>로그 탐색기</span>
        </a>

        <a th:href="${activeProject != null} ? @{/projects/{id}/issues(id=${activeProject})} : '#'"
           th:classappend="${activeMenu == 'issues'} ?
                           'bg-docu-primary text-white shadow-docu-sm' :
                           'text-docu-secondary hover:bg-surface-base hover:text-docu-ink'"
           class="flex items-center gap-3 px-3 py-2.5 rounded-docu-btn text-sm font-medium transition-colors">
            <span>이슈</span>
        </a>

        <a th:href="${activeProject != null} ? @{/projects/{id}/patch-notes(id=${activeProject})} : '#'"
           th:classappend="${activeMenu == 'patch-notes'} ?
                           'bg-docu-primary text-white shadow-docu-sm' :
                           'text-docu-secondary hover:bg-surface-base hover:text-docu-ink'"
           class="flex items-center gap-3 px-3 py-2.5 rounded-docu-btn text-sm font-medium transition-colors">
            <span>패치노트</span>
        </a>

        <a th:href="${activeProject != null} ? @{/projects/{id}/alerts(id=${activeProject})} : '#'"
           th:classappend="${activeMenu == 'alerts'} ?
                           'bg-docu-primary text-white shadow-docu-sm' :
                           'text-docu-secondary hover:bg-surface-base hover:text-docu-ink'"
           class="flex items-center gap-3 px-3 py-2.5 rounded-docu-btn text-sm font-medium transition-colors">
            <span>알림</span>
        </a>

        <a th:href="${activeProject != null} ? @{/projects/{id}/settings(id=${activeProject})} : '#'"
           th:classappend="${activeMenu == 'settings'} ?
                           'bg-docu-primary text-white shadow-docu-sm' :
                           'text-docu-secondary hover:bg-surface-base hover:text-docu-ink'"
           class="flex items-center gap-3 px-3 py-2.5 rounded-docu-btn text-sm font-medium transition-colors">
            <span>설정</span>
        </a>
    </nav>

    <div class="p-3 shrink-0">
        <a href="/my/profile"
           class="flex items-center gap-3 px-3 py-2.5 rounded-docu-btn text-sm font-medium
                  text-docu-secondary hover:bg-surface-base hover:text-docu-ink transition-colors">
            <span>마이페이지</span>
        </a>
    </div>

    <script>
        (function () {
            const btn = document.getElementById('project-selector-btn');
            const dropdown = document.getElementById('project-dropdown');
            const chevron = document.getElementById('project-selector-chevron');
            if (!btn || !dropdown) return;

            btn.addEventListener('click', function (e) {
                e.stopPropagation();
                const isOpen = !dropdown.classList.contains('hidden');
                dropdown.classList.toggle('hidden', isOpen);
                chevron.classList.toggle('rotate-180', !isOpen);
            });

            document.addEventListener('click', function () {
                dropdown.classList.add('hidden');
                chevron.classList.remove('rotate-180');
            });
        })();
    </script>

</aside>

</body>
</html>
