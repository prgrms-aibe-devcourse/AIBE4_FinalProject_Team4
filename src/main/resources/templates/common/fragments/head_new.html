<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<!--
    head_new.html
    base-layout.html의 <head> 내부에 포함될 공통 리소스 (스크립트, 스타일)
    주의: <head> 태그를 다시 선언하지 말고 th:block을 사용해야 함.
-->
<th:block th:fragment="head(title)">
    <!-- Tailwind CSS CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: {
                        docu: {
                            primary: {
                                light: '#D8ECFB',
                                DEFAULT: '#4A9EE8',
                                dark: '#2F7FC6',
                            },
                            secondary: {
                                light: '#9CA3AF',
                                DEFAULT: '#6B7280',
                                dark: '#4B5563',
                            },
                            danger: {
                                light: '#FBE4E4',
                                DEFAULT: '#E84A4A',
                                dark: '#B93838',
                            },
                            warning: {
                                light: '#F8E7BF',
                                DEFAULT: '#E8A020',
                                dark: '#B67C18',
                            },
                            success: {
                                light: '#DCEFE4',
                                DEFAULT: '#3BAA6E',
                                dark: '#2F8557',
                            },
                            ink: '#1A1F3A',
                        },
                        surface: {
                            base: '#F2EFE9',
                            card: '#FAF8F4',
                            sidebar: '#FFFFFF',
                            code: '#1A1F3A',
                        },
                        divider: '#D8D4CC',
                    },
                    fontSize: {
                        'display': ['1.875rem', { lineHeight: '2.25rem', fontWeight: '700' }],
                        'h1': ['1.5rem', { lineHeight: '2rem', fontWeight: '700' }],
                        'h2': ['1.25rem', { lineHeight: '1.75rem', fontWeight: '600' }],
                        'base': ['1rem', { lineHeight: '1.5rem', fontWeight: '400' }],
                        'sm': ['0.875rem', { lineHeight: '1.25rem', fontWeight: '400' }],
                        'xs': ['0.75rem', { lineHeight: '1rem', fontWeight: '500' }],
                        '2xs': ['0.625rem', { lineHeight: '0.875rem', fontWeight: '500' }],
                    },
                    spacing: {
                        'sidebar': '240px',
                        'header': '64px',
                        'content-p': '1.5rem',
                        'widget-p': '1.25rem',
                    },
                    borderRadius: {
                        'docu-btn': '0.375rem',
                        'docu-card': '0.5rem',
                        'docu-modal': '0.75rem',
                    },
                    boxShadow: {
                        'docu-sm': '2px 2px 0 rgba(26, 31, 58, 0.12)',
                        'docu-card': '3px 3px 0 rgba(26, 31, 58, 0.18)',
                        'docu-modal': '4px 4px 0 rgba(26, 31, 58, 0.18)',
                        'docu-primary': '2px 2px 0 rgba(74, 158, 232, 0.35)',
                        'docu-danger': '2px 2px 0 rgba(232, 74, 74, 0.28)',
                        'docu-warning': '2px 2px 0 rgba(232, 160, 32, 0.28)',
                        'docu-success': '2px 2px 0 rgba(59, 170, 110, 0.28)',
                    },
                    fontFamily: {
                        sans: ['Noto Sans KR', 'Pretendard', 'Inter', 'ui-sans-serif', 'system-ui', 'sans-serif'],
                    },
                    borderWidth: {
                        3: '3px',
                    },
                }
            },
            plugins: [],
        }
    </script>
    <style>

        /* 기본 스크롤바 */
        ::-webkit-scrollbar {
            width: 8px;
            height: 8px;
        }

        ::-webkit-scrollbar-track {
            background: transparent;
        }

        ::-webkit-scrollbar-thumb {
            background: #D1D5DB;
            border-radius: 4px;
        }

        ::-webkit-scrollbar-thumb:hover {
            background: #9CA3AF;
        }

        /* Docu 전용 스크롤 패널 */
        .docu-scroll::-webkit-scrollbar {
            width: 10px;
            height: 10px;
        }

        .docu-scroll::-webkit-scrollbar-track {
            background: #F2EFE9;
            border-left: 1px solid #D8D4CC;
        }

        .docu-scroll::-webkit-scrollbar-thumb {
            background: #C8C4BB;
            border: 2px solid #F2EFE9;
            border-radius: 9999px;
        }

        .docu-scroll::-webkit-scrollbar-thumb:hover {
            background: #9CA3AF;
        }

        .line-clamp-2 {
            display: -webkit-box;
            -webkit-line-clamp: 2;
            -webkit-box-orient: vertical;
            overflow: hidden;
        }
    </style>

    <!-- 공통 API 유틸리티 (CSRF 토큰 자동 주입 포함) -->
<!--    <script src="/js/common/FetchUtil.js"></script>-->
</th:block>
</html>
