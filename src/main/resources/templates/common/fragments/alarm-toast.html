<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<div th:fragment="alarm-toast">
    <!-- 우측 하단 알림 토스트 스택 -->
    <div id="alarm-toast-container"
         class="fixed bottom-4 left-4 right-4 sm:left-auto sm:right-4 z-50 flex flex-col gap-3 items-stretch sm:items-end"
         aria-live="polite"
         aria-atomic="false">
    </div>

    <script>
        (function () {
            const containerId = 'alarm-toast-container';
            const defaultDuration = 5000;

            function getToastMeta(type) {
                switch (type) {

                    // 문서
                    case 'rag':
                        return {
                            card: 'border-docu-primary',
                            iconWrap: 'bg-docu-primary-light text-docu-primary border border-docu-primary/20',
                            title: 'text-docu-primary',
                            badge: 'bg-docu-primary text-white',
                            action: 'text-docu-primary',
                            icon:
                                '<path stroke-linecap="round" stroke-linejoin="round" d="M7 3h7l5 5v13a1 1 0 01-1 1H7a1 1 0 01-1-1V4a1 1 0 011-1z"></path>' +
                                '<path stroke-linecap="round" stroke-linejoin="round" d="M14 3v5h5"></path>' +
                                '<path stroke-linecap="round" stroke-linejoin="round" d="M9 13h6M9 17h6"></path>'
                        };

                    // 패치노트
                    case 'patchnote':
                        return {
                            card: 'border-docu-success',
                            iconWrap: 'bg-docu-success-light text-docu-success border border-docu-success/20',
                            title: 'text-docu-success',
                            badge: 'bg-docu-success text-white',
                            action: 'text-docu-success',
                            icon:
                                '<path stroke-linecap="round" stroke-linejoin="round" d="M9 12l2 2 4-4"></path>' +
                                '<path stroke-linecap="round" stroke-linejoin="round" d="M7 3h7l5 5v13a1 1 0 01-1 1H7a1 1 0 01-1-1V4a1 1 0 011-1z"></path>' +
                                '<path stroke-linecap="round" stroke-linejoin="round" d="M14 3v5h5"></path>'
                        };

                    // 로그 탐색기
                    case 'log':
                        return {
                            card: 'border-docu-warning',
                            iconWrap: 'bg-docu-warning-light text-docu-warning-dark border border-docu-warning/30',
                            title: 'text-docu-warning-dark',
                            badge: 'bg-docu-warning-dark text-white',
                            action: 'text-docu-warning-dark',
                            icon:
                                '<path stroke-linecap="round" stroke-linejoin="round" d="M4 6h4"></path>' +
                                '<path stroke-linecap="round" stroke-linejoin="round" d="M10 6h10"></path>' +
                                '<path stroke-linecap="round" stroke-linejoin="round" d="M4 12h7"></path>' +
                                '<path stroke-linecap="round" stroke-linejoin="round" d="M17 12h3"></path>' +
                                '<path stroke-linecap="round" stroke-linejoin="round" d="M4 18h2"></path>' +
                                '<path stroke-linecap="round" stroke-linejoin="round" d="M12 18h8"></path>' +
                                '<circle cx="8" cy="6" r="1"></circle>' +
                                '<circle cx="14" cy="12" r="1"></circle>' +
                                '<circle cx="9" cy="18" r="1"></circle>'
                        };

                    // 이슈
                    case 'issue':
                        return {
                            card: 'border-docu-danger',
                            iconWrap: 'bg-docu-danger-light text-docu-danger border border-docu-danger/20',
                            title: 'text-docu-danger',
                            badge: 'bg-docu-danger text-white',
                            action: 'text-docu-danger',
                            icon:
                                '<path stroke-linecap="round" stroke-linejoin="round" d="M12 9v3"></path>' +
                                '<path stroke-linecap="round" stroke-linejoin="round" d="M12 16h.01"></path>' +
                                '<path stroke-linecap="round" stroke-linejoin="round" d="M10.29 3.86L1.82 18a2 2 0 001.71 3h16.94a2 2 0 001.71-3L13.71 3.86a2 2 0 00-3.42 0z"></path>'
                        };

                    default:
                        return {
                            card: 'border-divider',
                            iconWrap: 'bg-gray-100 text-gray-500 border border-gray-300',
                            title: 'text-gray-600',
                            badge: 'bg-gray-400 text-white',
                            action: 'text-gray-500',
                            icon:
                                '<circle cx="12" cy="12" r="9"></circle>'
                        };
                }
            }

            function sanitizeUrl(url) {
                const value = String(url || '#').trim();

                if (
                    value.startsWith('/') ||
                    value.startsWith('#') ||
                    value.startsWith('http://') ||
                    value.startsWith('https://')
                ) {
                    return value;
                }

                return '#';
            }

            function createAlarmToast({
                                          title = '알림',
                                          mainTypeLabel = '',
                                          subLabel = '',
                                          message = '',
                                          actionLabel = '바로가기 >',
                                          actionHref = '#',
                                          type = 'info',
                                          duration = defaultDuration
                                      }) {
                const container = document.getElementById(containerId);
                if (!container) return;

                const meta = getToastMeta(type);
                const toast = document.createElement('div');
                const safeHref = sanitizeUrl(actionHref);

                let removeTimer = null;
                let remainingTime = duration;
                let startTime = null;
                let paused = false;

                toast.setAttribute('role', 'status');
                toast.setAttribute('aria-atomic', 'true');

                toast.className =
                    'w-full sm:max-w-sm bg-surface-card border rounded-docu-card shadow-docu-card p-4 ' +
                    meta.card +
                    ' translate-y-6 opacity-0 transition-all duration-300';

                const mainBadgeHtml = mainTypeLabel
                    ? `<span class="inline-flex items-center px-2 py-0.5 rounded-full text-xs font-bold ${meta.badge}">${escapeHtml(mainTypeLabel)}</span>`
                    : '';

                const subBadgeHtml = subLabel
                    ? `<span class="inline-flex items-center px-2 py-0.5 rounded-full text-xs font-semibold bg-surface-sub text-docu-secondary-dark border border-divider">${escapeHtml(subLabel)}</span>`
                    : '';

                const actionHtml = safeHref && safeHref !== '#'
                    ? `<a href="${escapeAttribute(safeHref)}"
                           class="inline-flex items-center gap-1 mt-3 text-xs font-semibold ${meta.action} hover:underline">
                            ${escapeHtml(actionLabel)}
                       </a>`
                    : '';

                toast.innerHTML = `
                    <div class="flex items-start gap-3">
                        <div class="flex-shrink-0 w-10 h-10 rounded-full flex items-center justify-center ${meta.iconWrap}">
                            <svg class="w-5 h-5" fill="none" stroke="currentColor" stroke-width="2.2" viewBox="0 0 24 24" aria-hidden="true">
                                ${meta.icon}
                            </svg>
                        </div>

                        <div class="flex-1 min-w-0">
                            <div class="flex items-center gap-1.5 flex-wrap mb-1.5">
                                ${mainBadgeHtml}
                                ${subBadgeHtml}
                            </div>

                            <p class="text-sm font-bold ${meta.title} truncate">${escapeHtml(title)}</p>

                            <p class="mt-1 text-xs text-docu-secondary leading-relaxed line-clamp-2">
                                ${escapeHtml(message)}
                            </p>

                            ${actionHtml}
                        </div>
                    </div>
                `;

                container.appendChild(toast);

                requestAnimationFrame(() => {
                    requestAnimationFrame(() => {
                        toast.classList.remove('translate-y-6', 'opacity-0');
                    });
                });

                function removeToast() {
                    if (!toast.isConnected) return;
                    toast.classList.add('translate-y-4', 'opacity-0');
                    setTimeout(() => {
                        toast.remove();
                    }, 300);
                }

                function startTimer(ms) {
                    clearTimeout(removeTimer);
                    startTime = Date.now();
                    removeTimer = setTimeout(() => {
                        removeToast();
                    }, ms);
                }

                function pauseTimer() {
                    if (paused || removeTimer === null) return;
                    clearTimeout(removeTimer);
                    removeTimer = null;
                    remainingTime -= Date.now() - startTime;
                    paused = true;
                }

                function resumeTimer() {
                    if (!paused) return;
                    paused = false;
                    startTimer(Math.max(remainingTime, 0));
                }

                toast.addEventListener('mouseenter', pauseTimer);
                toast.addEventListener('mouseleave', resumeTimer);

                startTimer(duration);
            }

            function escapeHtml(value) {
                return String(value)
                    .replace(/&/g, '&amp;')
                    .replace(/</g, '&lt;')
                    .replace(/>/g, '&gt;')
                    .replace(/"/g, '&quot;')
                    .replace(/'/g, '&#039;');
            }

            function escapeAttribute(value) {
                return String(value)
                    .replace(/&/g, '&amp;')
                    .replace(/"/g, '&quot;')
                    .replace(/'/g, '&#039;')
                    .replace(/</g, '&lt;')
                    .replace(/>/g, '&gt;');
            }

            window.showAlarmToast = createAlarmToast;
        })();
    </script>
</div>
</html>
