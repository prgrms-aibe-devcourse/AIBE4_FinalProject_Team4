<!DOCTYPE html>
<html lang="ko"
      xmlns:th="http://www.thymeleaf.org"
      xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
      layout:decorate="~{common/layout/base-layout}">
<head>
    <title>회사 전환 확인</title>
</head>
<body>
<div layout:fragment="body" class="min-h-screen bg-surface-base px-4 py-10 sm:px-6">
    <div class="mx-auto flex min-h-[calc(100vh-5rem)] max-w-lg items-center justify-center">
        <section class="card-modal w-full p-7 sm:p-8">
            <div class="mb-6 text-center">
                <img src="/images/logo.png" alt="DOCUMIND" class="mx-auto h-12 w-auto object-contain">
            </div>

            <!-- ① CEO — 탈퇴 불가 안내 -->
            <div th:if="${data.isCeo()}" class="space-y-6 text-center">
                <div class="mx-auto flex h-16 w-16 items-center justify-center rounded-full border border-docu-danger bg-docu-danger-light text-docu-danger"
                     aria-hidden="true">
                    <span class="text-3xl">🚫</span>
                </div>

                <div class="space-y-2">
                    <span class="badge-status-firing">참여 불가</span>
                    <h1 class="text-h1 text-docu-ink">참여할 수 없습니다</h1>
                </div>

                <div class="card-base bg-surface-base p-5 text-left space-y-3">
                    <p class="text-sm leading-6 text-docu-secondary">
                        현재
                        <span class="font-bold text-docu-ink" th:text="${data.currentCompanyName()}">Company A</span>의
                        <span class="font-bold text-docu-primary">CEO</span>로 등록되어 있습니다.
                    </p>
                    <p class="text-sm leading-6 text-docu-secondary">
                        CEO는 회사를 탈퇴하고 다른 회사의 프로젝트에 참여할 수 없습니다.
                        다른 회사의 초대에 참여하려면 먼저 CEO 권한을 이전해야 합니다.
                    </p>
                </div>

                <a href="/member/dashboard" class="btn-secondary w-full">
                    돌아가기
                </a>
            </div>

            <!-- ② 일반 멤버 — 회사 전환 확인 -->
            <div th:if="${!data.isCeo()}" class="space-y-6">
                <div class="text-center space-y-4">
                    <div class="mx-auto flex h-16 w-16 items-center justify-center rounded-full border border-docu-warning bg-docu-warning-light text-docu-warning"
                         aria-hidden="true">
                        <span class="text-3xl">⚠️</span>
                    </div>

                    <div class="space-y-2">
                        <span class="badge-status-pending">회사 전환 필요</span>
                        <h1 class="text-h1 text-docu-ink">회사 전환이 필요합니다</h1>
                    </div>
                </div>

                <!-- 정보 카드 -->
                <div class="card-base bg-docu-warning-light/30 border-docu-warning p-5 space-y-3">
                    <div class="flex items-center justify-between gap-4 text-sm">
                        <span class="font-semibold text-docu-warning-dark">현재 소속</span>
                        <span class="font-bold text-docu-ink text-right" th:text="${data.currentCompanyName()}">Company A</span>
                    </div>
                    <div class="flex items-center justify-between gap-4 text-sm">
                        <span class="font-semibold text-docu-warning-dark">초대 프로젝트</span>
                        <span class="font-bold text-docu-ink text-right" th:text="${data.projectName()}">Project RPG</span>
                    </div>
                    <div class="flex items-center justify-between gap-4 text-sm">
                        <span class="font-semibold text-docu-warning-dark">초대자</span>
                        <span class="font-bold text-docu-ink text-right" th:text="${data.inviterName() + '님'}">홍길동님</span>
                    </div>
                </div>

                <div class="text-center space-y-2">
                    <p class="text-sm leading-6 text-docu-secondary">
                        초대를 수락하면 현재 소속 회사
                        <span class="font-bold text-docu-ink" th:text="${data.currentCompanyName()}">Company A</span>에서
                        자동으로 탈퇴됩니다.
                    </p>
                    <p class="text-sm font-bold text-docu-danger">
                        이 작업은 되돌릴 수 없습니다.
                    </p>
                </div>

                <!-- 카운트다운 -->
                <div class="card-base bg-docu-warning-light/30 border-docu-warning px-4 py-3">
                    <div class="flex items-center justify-between gap-3">
                        <span class="text-xs font-bold uppercase tracking-wide text-docu-warning-dark">⏱ 초대 만료까지</span>
                        <span id="invite-countdown"
                              class="text-sm font-mono font-bold text-docu-warning-dark"
                              th:data-expires="${data.expiresAtEpochMs()}">계산 중...</span>
                    </div>
                </div>

                <!-- 폼 -->
                <form th:action="@{/invite/accept}" method="post" class="space-y-3">
                    <input type="hidden" name="token" th:value="${data.rawToken()}"/>
                    <input type="hidden" name="forceLeaveCompany" value="true"/>
                    <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}"/>

                    <button type="submit" class="btn-primary w-full">
                        회사를 탈퇴하고 초대 수락하기
                    </button>
                </form>

                <a href="/member/dashboard"
                   class="block rounded-docu-btn py-2 text-center text-sm font-medium text-docu-secondary transition-colors hover:text-docu-ink focus-ring">
                    취소하고 돌아가기
                </a>
            </div>
        </section>
    </div>
</div>

<script th:inline="javascript">
    /*<![CDATA[*/
    (function () {
        const el = document.getElementById('invite-countdown');
        if (!el) return;

        const target = Number(el.dataset.expires);

        function pad(n) { return String(n).padStart(2, '0'); }

        function tick() {
            const diff = target - Date.now();

            if (diff <= 0) {
                el.textContent = '만료됨';
                el.className = 'text-sm font-mono font-bold text-docu-danger';
                const btn = document.querySelector('button[type="submit"]');
                if (btn) {
                    btn.disabled = true;
                    btn.classList.add('opacity-50', 'cursor-not-allowed');
                }
                return;
            }

            const h = Math.floor(diff / 3600000);
            const m = Math.floor((diff % 3600000) / 60000);
            const s = Math.floor((diff % 60000) / 1000);
            el.textContent = `${pad(h)}:${pad(m)}:${pad(s)} 후 만료`;

            if (diff < 3600000) {
                el.className = 'text-sm font-mono font-bold text-docu-danger';
            }
        }

        tick();
        setInterval(tick, 1000);
    })();
    /*]]>*/
</script>
</body>
</html>
