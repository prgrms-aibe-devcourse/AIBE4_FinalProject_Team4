<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="ko">
<head th:replace="~{common/head :: head('회사 전환 확인')}"></head>
<body class="min-h-screen bg-gray-50 flex items-center justify-center p-4">

  <div class="w-full max-w-md bg-white rounded-2xl shadow-md overflow-hidden">

    <!-- Header -->
    <div class="bg-gray-900 px-8 py-6 text-center">
      <span class="text-white text-xl font-bold tracking-tight">📄 DocuMind</span>
    </div>

    <!-- Body -->
    <div class="px-8 py-8">

      <!-- ① CEO — 탈퇴 불가 안내 -->
      <div th:if="${data.isCeo()}">
        <div class="flex items-center gap-2 mb-4">
          <span class="text-2xl">🚫</span>
          <h1 class="text-xl font-bold text-gray-900">참여할 수 없습니다</h1>
        </div>
        <p class="text-sm text-gray-600 leading-relaxed mb-2">
          현재 <span class="font-semibold text-gray-800"
                     th:text="${data.currentCompanyName()}">Company A</span>의
          <span class="font-semibold text-indigo-600">CEO</span>로 등록되어 있습니다.
        </p>
        <p class="text-sm text-gray-600 leading-relaxed mb-6">
          CEO는 회사를 탈퇴하고 다른 회사의 프로젝트에 참여할 수 없습니다.
          다른 회사의 초대에 참여하려면 먼저 CEO 권한을 이전해야 합니다.
        </p>
        <a href="/member/dashboard"
           class="block text-center py-3 bg-gray-100 hover:bg-gray-200 text-gray-700
                  font-semibold rounded-xl transition-colors">
          돌아가기
        </a>
      </div>

      <!-- ② 일반 멤버 — 회사 전환 확인 -->
      <div th:if="${!data.isCeo()}">
        <div class="flex items-center gap-2 mb-4">
          <span class="text-2xl">⚠️</span>
          <h1 class="text-xl font-bold text-gray-900">회사 전환이 필요합니다</h1>
        </div>

        <!-- Info -->
        <div class="bg-amber-50 border border-amber-200 rounded-xl p-5 mb-5 space-y-3">
          <div class="flex items-center gap-3">
            <span class="text-xs text-amber-600 w-24 shrink-0">현재 소속</span>
            <span class="text-sm font-semibold text-gray-800"
                  th:text="${data.currentCompanyName()}">Company A</span>
          </div>
          <div class="flex items-center gap-3">
            <span class="text-xs text-amber-600 w-24 shrink-0">초대 프로젝트</span>
            <span class="text-sm font-semibold text-gray-800"
                  th:text="${data.projectName()}">Project RPG</span>
          </div>
          <div class="flex items-center gap-3">
            <span class="text-xs text-amber-600 w-24 shrink-0">초대자</span>
            <span class="text-sm font-semibold text-gray-800"
                  th:text="${data.inviterName()} + '님'">홍길동님</span>
          </div>
        </div>

        <p class="text-sm text-gray-600 leading-relaxed mb-1">
          초대를 수락하면 현재 소속 회사
          <span class="font-semibold text-gray-800" th:text="${data.currentCompanyName()}">Company A</span>에서
          자동으로 탈퇴됩니다.
        </p>
        <p class="text-sm text-red-500 leading-relaxed mb-4">
          이 작업은 되돌릴 수 없습니다.
        </p>

        <!-- Countdown Timer -->
        <div class="flex items-center justify-between bg-amber-50 border border-amber-200 rounded-xl px-5 py-3 mb-6">
          <span class="text-xs text-amber-600 font-medium">⏱ 초대 만료까지</span>
          <span id="invite-countdown"
                class="text-sm font-mono font-bold text-amber-700"
                th:data-expires="${data.expiresAtEpochMs()}">계산 중...</span>
        </div>

        <!-- Accept Form (forceLeaveCompany=true) -->
        <form th:action="@{/invite/accept}" method="post" class="space-y-3">
          <input type="hidden" name="token" th:value="${data.rawToken()}"/>
          <input type="hidden" name="forceLeaveCompany" value="true"/>
            <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}"/>
            <button type="submit"
                  class="w-full py-3 bg-indigo-600 hover:bg-indigo-700 text-white font-semibold
                         rounded-xl transition-colors">
            회사를 탈퇴하고 초대 수락하기
          </button>
        </form>

        <a href="/member/dashboard"
           class="block text-center text-sm text-gray-400 hover:text-gray-600 mt-3">
          취소하고 돌아가기
        </a>
      </div>

    </div>
  </div>

<script>
  (function () {
    const el = document.getElementById('invite-countdown');
    if (!el) return; // CEO 분기에는 카운트다운 없음

    const target = Number(el.dataset.expires);

    function pad(n) { return String(n).padStart(2, '0'); }

    function tick() {
      const diff = target - Date.now();

      if (diff <= 0) {
        el.textContent = '만료됨';
        el.classList.remove('text-amber-700');
        el.classList.add('text-red-600');
        const btn = document.querySelector('button[type="submit"]');
        if (btn) {
          btn.disabled = true;
          btn.classList.add('opacity-50', 'cursor-not-allowed');
        }
        return;
      }

      const h = Math.floor(diff / 3600000);
      const m = Math.floor((diff % 3600000) / 60000);
      const s = Math.floor((diff % 60000) / 1000);
      el.textContent = `${pad(h)}:${pad(m)}:${pad(s)} 후 만료`;

      if (diff < 3600000) {
        el.classList.remove('text-amber-700');
        el.classList.add('text-red-600');
      }
    }

    tick();
    setInterval(tick, 1000);
  })();
</script>
</body>
</html>
