<!DOCTYPE html>
<html lang="ko"
      xmlns:th="http://www.thymeleaf.org"
      xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
      layout:decorate="~{common/layout/mypage-layout}">
<head>
    <title>참여 중인 프로젝트</title>
</head>
<body>
<div layout:fragment="content">
    <div class="max-w-4xl mx-auto space-y-6">
        <!-- 페이지 헤더 -->
        <div class="flex flex-col sm:flex-row sm:items-start sm:justify-between gap-4">
            <div>
                <h2 class="text-h1 text-docu-ink">참여 중인 프로젝트</h2>
                <p th:unless="${headerInfo != null and headerInfo.globalRole() != null and headerInfo.globalRole().name() == 'ADMIN'}"
                   class="mt-1 text-sm text-docu-secondary">
                    작업할 프로젝트를 선택해주세요.
                </p>
            </div>
            <!-- 새 프로젝트 생성 버튼 -->
            <button th:if="${headerInfo != null and headerInfo.globalRole() != null and headerInfo.globalRole().name() == 'CEO' and headerInfo.companyStatus() != null and headerInfo.companyStatus().name() == 'APPROVED'}"
                    type="button"
                    onclick="openProjectModal()"
                    class="btn-primary flex items-center gap-2">
                <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 4v16m8-8H4"/>
                </svg>
                새 프로젝트 생성
            </button>
        </div>

        <!-- 프로젝트 목록 -->
        <div th:replace="~{member/dashboard-fragments :: project-list}"></div>
    </div>

    <!-- 프로젝트 생성 모달 -->
    <div id="project-modal" class="hidden fixed inset-0 z-[100] flex items-center justify-center bg-black/40">
        <div class="bg-surface-card rounded-docu-modal shadow-docu-modal w-full max-w-md mx-4 p-6 flex flex-col gap-6">
            <!-- 모달 헤더 -->
            <div class="flex items-center justify-between">
                <h3 class="text-h2 text-docu-ink">새 프로젝트 생성</h3>
                <button type="button" onclick="closeProjectModal()" class="text-docu-secondary hover:text-docu-ink transition-colors">
                    <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M6 18L18 6M6 6l12 12"/>
                    </svg>
                </button>
            </div>

            <!-- 프로젝트 로고 -->
            <div class="flex flex-col items-center gap-2">
                <p class="self-start form-label uppercase tracking-wide">프로젝트 로고 (선택)</p>
                <button type="button" onclick="document.getElementById('project-icon-input').click()"
                        class="relative group w-20 h-20 rounded-docu-card bg-surface-base flex items-center justify-center overflow-hidden border-2 border-divider hover:border-docu-primary transition-all">
                    <img id="project-icon-preview" class="hidden w-full h-full object-cover" alt="프로젝트 로고"/>
                    <svg id="project-icon-placeholder" class="w-8 h-8 text-docu-secondary" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="1.5" d="M4 6a2 2 0 012-2h2a2 2 0 012 2v2a2 2 0 01-2 2H6a2 2 0 01-2-2V6z M14 6a2 2 0 012-2h2a2 2 0 012 2v2a2 2 0 01-2 2h-2a2 2 0 01-2-2V6z M4 16a2 2 0 012-2h2a2 2 0 012 2v2a2 2 0 01-2 2H6a2 2 0 01-2-2v-2z M14 16a2 2 0 012-2h2a2 2 0 012 2v2a2 2 0 01-2 2h-2a2 2 0 01-2-2v-2z"/>
                    </svg>
                    <div class="absolute inset-0 bg-black/30 opacity-0 group-hover:opacity-100 transition-opacity flex items-center justify-center">
                        <svg class="w-6 h-6 text-white" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15.232 5.232l3.536 3.536m-2.036-5.036a2.5 2.5 0 113.536 3.536L6.5 21.036H3v-3.572L16.732 3.732z"/>
                        </svg>
                    </div>
                </button>
                <input type="file" id="project-icon-input" accept="image/*" class="hidden" onchange="previewProjectIcon(this)"/>
            </div>

            <!-- 프로젝트 이름 -->
            <div class="flex flex-col gap-1.5">
                <label for="projectName" class="form-label uppercase tracking-wide">
                    프로젝트 이름 <span class="text-docu-danger">*</span>
                </label>
                <input type="text" id="projectName" maxlength="100" placeholder="프로젝트 이름을 입력하세요"
                       class="form-input"/>
                <p id="projectName-error" class="hidden text-xs text-docu-danger font-medium"></p>
            </div>

            <p id="project-global-error" class="hidden text-sm text-docu-danger text-center"></p>

            <!-- 버튼 영역 -->
            <div class="flex gap-3 pt-2">
                <button type="button" onclick="closeProjectModal()" class="btn-ghost flex-1">
                    취소
                </button>
                <button type="button" id="project-create-btn" onclick="submitCreateProject()" class="btn-primary flex-1">
                    생성하기
                </button>
            </div>
        </div>
    </div>

    <!-- 스크립트 로드 -->
    <script th:src="@{/js/member/Dashboard.js}"></script>
</div>
</body>
</html>
