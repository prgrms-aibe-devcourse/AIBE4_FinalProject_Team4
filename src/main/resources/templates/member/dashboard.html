<!DOCTYPE html>
<html lang="ko" xmlns:th="http://www.thymeleaf.org"
      th:replace="~{common/layout/layout :: layout('참여 중인 프로젝트', ~{:: #main-content})}">
<head>
    <!-- layout.html의 head로 대체 -->
</head>
<body class="bg-gray-50 min-h-screen">
<div id="main-content">
    <th:block th:if="${showSidebar == null or !showSidebar}">

        <div class="flex flex-col min-h-screen">
            <div th:replace="~{common/fragments/header-auth :: header-auth}"></div>

            <main class="flex-1 pt-20 w-full max-w-4xl mx-auto px-6 pb-10">
                <div class="flex flex-col gap-4 sm:flex-row sm:items-start sm:justify-between mb-8">
                    <div>
                        <h1 class="text-3xl font-extrabold text-gray-900 tracking-tight">참여 중인 프로젝트</h1>
                        <!-- ADMIN에게는 부제목 미노출 -->
                        <p th:unless="${headerInfo != null
                                        and headerInfo.globalRole() != null
                                        and headerInfo.globalRole().name() == 'ADMIN'}"
                           class="mt-2 text-sm text-gray-500 leading-relaxed">
                            작업할 프로젝트를 선택해주세요. 각 프로젝트의 팀 내 역할과 최근 활동 상태를 확인하실 수 있습니다.
                        </p>
                    </div>
                    <!-- 새 프로젝트 생성 버튼: CEO + 회사 승인(APPROVED) 상태에만 노출 -->
                    <button th:if="${headerInfo != null
                                    and headerInfo.globalRole() != null
                                    and headerInfo.globalRole().name() == 'CEO'
                                    and headerInfo.companyStatus() != null
                                    and headerInfo.companyStatus().name() == 'APPROVED'}"
                            type="button"
                            onclick="openProjectModal()"
                            class="inline-flex items-center gap-2 rounded-xl bg-blue-500 px-5 py-2.5
                                   text-sm font-semibold text-white shadow-sm hover:bg-blue-600
                                   active:scale-[0.99] transition shrink-0">
                        <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 4v16m8-8H4"/>
                        </svg>
                        새 프로젝트 생성
                    </button>
                </div>
                <div th:replace="~{member/dashboard-fragments :: project-list}"></div>
            </main>

            <footer class="border-t border-gray-200 py-6 text-center text-xs text-gray-400">
                © 2026 Documind Incs. All rights reserved.
            </footer>
        </div>
    </th:block>

    <th:block th:if="${showSidebar}">

        <div th:replace="~{common/fragments/sidebar-mypage :: sidebar-mypage('projects')}"></div>

        <div class="ml-64 flex flex-col min-h-screen">
            <div th:replace="~{common/fragments/header-auth :: user-bar}"></div>

            <main class="flex-1 px-8 py-8">
                <div class="flex flex-col gap-4 sm:flex-row sm:items-start sm:justify-between mb-8">
                    <div>
                        <h1 class="text-3xl font-extrabold text-gray-900 tracking-tight">참여 중인 프로젝트</h1>
                        <!-- ADMIN에게는 부제목 미노출 -->
                        <p th:unless="${headerInfo != null
                                        and headerInfo.globalRole() != null
                                        and headerInfo.globalRole().name() == 'ADMIN'}"
                           class="mt-2 text-sm text-gray-500 leading-relaxed">
                            작업할 프로젝트를 선택해주세요. 각 프로젝트의 팀 내 역할과 최근 활동 상태를 확인하실 수 있습니다.
                        </p>
                    </div>
                    <!-- 새 프로젝트 생성 버튼: CEO + 회사 승인(APPROVED) 상태에만 노출 -->
                    <button th:if="${headerInfo != null
                                    and headerInfo.globalRole() != null
                                    and headerInfo.globalRole().name() == 'CEO'
                                    and headerInfo.companyStatus() != null
                                    and headerInfo.companyStatus().name() == 'APPROVED'}"
                            type="button"
                            onclick="openProjectModal()"
                            class="inline-flex items-center gap-2 rounded-xl bg-blue-500 px-5 py-2.5
                                   text-sm font-semibold text-white shadow-sm hover:bg-blue-600
                                   active:scale-[0.99] transition shrink-0">
                        <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 4v16m8-8H4"/>
                        </svg>
                        새 프로젝트 생성
                    </button>
                </div>
                <div th:replace="~{member/dashboard-fragments :: project-list}"></div>
            </main>

            <footer class="border-t border-gray-200 py-6 text-center text-xs text-gray-400">
                © 2026 Documind Incs. All rights reserved.
            </footer>
        </div>
    </th:block>

    <!-- ── 프로젝트 생성 모달 ── -->
    <div id="project-modal"
         class="hidden fixed inset-0 z-[100] flex items-center justify-center bg-black/40">
        <div class="bg-white rounded-2xl shadow-2xl w-full max-w-md mx-4 p-8 flex flex-col gap-6">

            <!-- 모달 헤더 -->
            <div class="flex items-center justify-between">
                <h2 class="text-lg font-bold text-gray-900">새 프로젝트 생성</h2>
                <button type="button" onclick="closeProjectModal()"
                        class="text-gray-400 hover:text-gray-600 transition-colors">
                    <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M6 18L18 6M6 6l12 12"/>
                    </svg>
                </button>
            </div>

            <!-- 프로젝트 로고 업로드 -->
            <div class="flex flex-col items-center gap-3">
                <p class="self-start text-xs font-semibold text-gray-500 uppercase tracking-wide">프로젝트 로고 (선택)</p>
                <button type="button"
                        onclick="document.getElementById('project-icon-input').click()"
                        class="relative group w-20 h-20 rounded-2xl bg-indigo-100 flex items-center justify-center
                               overflow-hidden ring-2 ring-gray-200 hover:ring-indigo-300 transition-all">
                    <!-- 미리보기 이미지 (기본 숨김) -->
                    <img id="project-icon-preview"
                         class="hidden w-full h-full object-cover"
                         alt="프로젝트 로고"/>
                    <!-- 기본 아이콘 -->
                    <svg id="project-icon-placeholder"
                         class="w-8 h-8 text-indigo-400" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="1.5"
                              d="M4 6a2 2 0 012-2h2a2 2 0 012 2v2a2 2 0 01-2 2H6a2 2 0 01-2-2V6z
                                 M14 6a2 2 0 012-2h2a2 2 0 012 2v2a2 2 0 01-2 2h-2a2 2 0 01-2-2V6z
                                 M4 16a2 2 0 012-2h2a2 2 0 012 2v2a2 2 0 01-2 2H6a2 2 0 01-2-2v-2z
                                 M14 16a2 2 0 012-2h2a2 2 0 012 2v2a2 2 0 01-2 2h-2a2 2 0 01-2-2v-2z"/>
                    </svg>
                    <!-- 호버 오버레이 -->
                    <div class="absolute inset-0 bg-black/20 opacity-0 group-hover:opacity-100 transition-opacity
                                flex items-center justify-center">
                        <svg class="w-6 h-6 text-white" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
                                  d="M3 9a2 2 0 012-2h.93a2 2 0 001.664-.89l.812-1.22A2 2 0 0110.07 4h3.86
                                     a2 2 0 011.664.89l.812 1.22A2 2 0 0018.07 7H19a2 2 0 012 2v9a2 2 0 01-2 2H5
                                     a2 2 0 01-2-2V9z M15 13a3 3 0 11-6 0 3 3 0 016 0z"/>
                        </svg>
                    </div>
                </button>
                <input type="file" id="project-icon-input"
                       accept="image/*" class="hidden"
                       onchange="previewProjectIcon(this)"/>
            </div>

            <!-- 프로젝트 이름 입력 -->
            <div class="flex flex-col gap-1.5">
                <label for="projectName"
                       class="text-xs font-semibold text-gray-500 uppercase tracking-wide">
                    프로젝트 이름 <span class="text-red-400">*</span>
                </label>
                <input type="text"
                       id="projectName"
                       maxlength="100"
                       placeholder="프로젝트 이름을 입력하세요"
                       class="w-full px-4 py-3 bg-gray-50 border border-gray-200 rounded-xl text-sm
                              text-gray-700 focus:outline-none focus:ring-2 focus:ring-blue-300
                              focus:border-transparent transition-all"/>
                <p id="projectName-error" class="hidden text-xs text-red-500"></p>
            </div>

            <!-- 글로벌 에러 -->
            <p id="project-global-error" class="hidden text-sm text-red-500 text-center"></p>

            <!-- 버튼 영역 -->
            <div class="flex gap-3">
                <button type="button"
                        onclick="closeProjectModal()"
                        class="flex-1 py-2.5 rounded-xl border border-gray-200
                               text-sm font-semibold text-gray-700 hover:bg-gray-50 transition-colors">
                    취소
                </button>
                <button type="button"
                        id="project-create-btn"
                        onclick="submitCreateProject()"
                        class="flex-1 py-2.5 rounded-xl bg-blue-500 hover:bg-blue-600
                               text-sm font-semibold text-white transition-colors">
                    새 프로젝트 생성
                </button>
            </div>

        </div>
    </div><!-- /project-modal -->

    <!-- 로그아웃 모달 + 공통 JS -->
    <div th:replace="~{common/fragments/header-auth :: logout-modal}"></div>
    <script th:src="@{/js/member/Auth.js}"></script>
    <script th:src="@{/js/member/Dashboard.js}"></script>
</div>
</body>
</html>
