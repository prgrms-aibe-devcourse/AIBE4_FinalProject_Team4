<!DOCTYPE html>
<html lang="ko"
      xmlns:th="http://www.thymeleaf.org"
      xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
      layout:decorate="~{common/layout/mypage-layout}">
<head>
    <title>회사 관리</title>
</head>
<body>
<div layout:fragment="content">
    <div class="max-w-2xl mx-auto space-y-6">

        <!-- 페이지 타이틀 -->
        <div>
            <h2 class="text-h1 text-docu-ink">회사 관리</h2>
            <p class="mt-1 text-sm text-docu-secondary">
                회사의 기본 정보를 수정하고 관리합니다.
            </p>
        </div>

        <!-- 글로벌 에러 / 성공 메시지 -->
        <div id="global-error" class="hidden p-4 rounded-docu-btn bg-docu-danger-light border border-docu-danger text-sm text-docu-danger"></div>
        <div id="success-message" class="hidden p-4 rounded-docu-btn bg-docu-success-light border border-docu-success text-sm text-docu-success-dark"></div>

        <!-- 기본 정보 카드 -->
        <div class="bg-surface-card rounded-docu-card border border-divider shadow-docu-card overflow-hidden">
            <div class="px-6 py-4 border-b border-divider bg-surface-card">
                <h3 class="text-base font-bold text-docu-ink">기본 정보</h3>
            </div>

            <div class="p-6 space-y-6">
                <!-- 회사 아이콘 -->
                <div class="flex flex-col items-center gap-3">
                    <div class="relative group">
                        <button type="button"
                                th:disabled="${company != null and !company.approved()}"
                                onclick="document.getElementById('company-icon-input').click()"
                                class="relative w-24 h-24 rounded-docu-card overflow-hidden border-2 border-divider bg-surface-base
                                       group-hover:border-docu-primary transition-colors disabled:cursor-not-allowed disabled:opacity-70">

                            <!-- 이미지 있는 경우 -->
                            <img th:if="${company?.profileUrl() != null}"
                                 th:src="${company.profileUrl()}"
                                 id="company-icon-preview"
                                 alt="회사 아이콘" class="w-full h-full object-cover"/>

                            <!-- 이미지 없는 경우 -->
                            <div th:unless="${company?.profileUrl() != null}"
                                 id="company-icon-fallback"
                                 class="w-full h-full flex items-center justify-center bg-docu-primary text-white text-2xl font-bold">
                                <span th:text="${company?.name() != null ? #strings.substring(company.name(),0,1) : '+'}">+</span>
                            </div>

                            <!-- 호버 오버레이 (편집 가능할 때만) -->
                            <div th:if="${company == null or company.approved()}"
                                 class="absolute inset-0 bg-black/30 opacity-0 group-hover:opacity-100 transition-opacity flex items-center justify-center">
                                <svg class="w-6 h-6 text-white" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15.232 5.232l3.536 3.536m-2.036-5.036a2.5 2.5 0 113.536 3.536L6.5 21.036H3v-3.572L16.732 3.732z"/>
                                </svg>
                            </div>
                        </button>
                        <input type="file" id="company-icon-input" accept="image/*" class="hidden" onchange="previewCompanyIcon(this)"/>
                        <input type="hidden" id="company-icon-original-src" th:value="${company?.profileUrl()}"/>
                    </div>
                    <p class="text-xs text-docu-secondary">권장: 500x500px (JPG, PNG)</p>
                </div>

                <!-- 회사명 입력 -->
                <div>
                    <label for="companyName" class="form-label uppercase tracking-wide mb-1">
                        회사/조직명
                    </label>
                    <div class="relative">
                        <input type="text"
                               id="companyName"
                               name="companyName"
                               th:value="${company?.name()}"
                               th:disabled="${company != null and !company.approved()}"
                               maxlength="50"
                               placeholder="회사명을 입력하세요"
                               class="w-full px-4 py-2.5 bg-white border-2 border-divider rounded-docu-btn text-sm text-docu-ink
                                      focus:outline-none focus:border-docu-primary focus:ring-0 transition-colors
                                      disabled:bg-surface-sub disabled:text-docu-secondary disabled:cursor-not-allowed"/>
                    </div>
                    <p id="companyName-error" class="hidden mt-1 text-xs text-docu-danger font-medium"></p>
                </div>

                <!-- 상태 표시 및 안내 -->
                <div th:if="${company == null}" class="p-3 bg-docu-primary-light/20 border border-docu-primary-light rounded-docu-btn flex gap-3">
                    <svg class="w-5 h-5 text-docu-primary shrink-0" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M13 16h-1v-4h-1m1-4h.01M21 12a9 9 0 11-18 0 9 9 0 0118 0z"/>
                    </svg>
                    <p class="text-sm text-docu-ink leading-relaxed">
                        회사를 등록하면 프로젝트를 생성하고 팀원을 초대할 수 있습니다.<br>
                        등록 후 관리자 승인이 필요합니다.
                    </p>
                </div>

                <div th:if="${company != null and company.pending()}" class="p-3 bg-docu-warning-light/30 border border-docu-warning rounded-docu-btn flex gap-3">
                    <svg class="w-5 h-5 text-docu-warning-dark shrink-0" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 8v4l3 3m6-3a9 9 0 11-18 0 9 9 0 0118 0z"/>
                    </svg>
                    <span class="text-sm font-semibold text-docu-warning-dark">관리자 승인 대기 중입니다.</span>
                </div>

                <div th:if="${company != null and company.suspended()}" class="p-3 bg-docu-danger-light/30 border border-docu-danger rounded-docu-btn flex gap-3">
                    <svg class="w-5 h-5 text-docu-danger shrink-0" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 8v4m0 4h.01M21 12a9 9 0 11-18 0 9 9 0 0118 0z"/>
                    </svg>
                    <span class="text-sm font-semibold text-docu-danger">승인이 거부되었습니다. 관리자에게 문의하세요.</span>
                </div>
            </div>

            <!-- 하단 버튼 -->
            <div th:if="${company == null or company.approved()}" class="px-6 py-4 bg-surface-card border-t border-divider flex justify-end gap-3">
                <button type="button" onclick="resetCompanyForm()" class="btn-ghost">
                    취소
                </button>

                <button th:if="${company != null}" type="button" onclick="updateCompany()" class="btn-primary">
                    변경 사항 저장
                </button>

                <button th:unless="${company != null}" type="button" onclick="registerCompany()" class="btn-primary">
                    승인 요청하기
                </button>
            </div>
        </div>
    </div>

    <!-- 스크립트 로드 -->
    <script th:src="@{/js/member/Company.js}"></script>
</div>
</body>
</html>
