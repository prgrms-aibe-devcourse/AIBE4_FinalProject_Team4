<!DOCTYPE html>
<html lang="ko"
      xmlns:th="http://www.thymeleaf.org"
      xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
      layout:decorate="~{common/layout/base-layout}">
<head>
    <title>초대 오류</title>
</head>
<body>
<div layout:fragment="body" class="min-h-screen bg-surface-base px-4 py-10 sm:px-6">
    <div class="mx-auto flex min-h-[calc(100vh-5rem)] max-w-lg items-center justify-center">
        <section class="card-modal w-full p-7 sm:p-8 text-center">
            <div class="mb-6">
                <img src="/images/logo.png" alt="DOCUMIND" class="mx-auto h-12 w-auto object-contain">
            </div>

            <div class="mx-auto mb-5 flex h-16 w-16 items-center justify-center rounded-full border border-docu-danger bg-docu-danger-light text-docu-danger"
                 aria-hidden="true">
                <span class="text-3xl">🔗</span>
            </div>

            <div class="space-y-3">
                <span class="badge-status-firing">초대 오류</span>
                <h1 class="text-h1 text-docu-danger">초대 링크를 사용할 수 없습니다</h1>
            </div>

            <p class="mt-4 text-sm leading-6 text-docu-secondary" th:text="${errorMessage}">
                초대 링크가 만료되었거나 유효하지 않습니다.<br>
                운영자에게 재초대를 요청해 주세요.
            </p>

            <div class="mt-6 flex flex-col gap-3">
                <a href="/member/dashboard" class="btn-primary w-full">
                    대시보드로 이동
                </a>
                <button type="button" onclick="handleLogout()" class="btn-secondary w-full">
                    다른 계정으로 로그인
                </button>
            </div>
        </section>
    </div>

    <script>
        async function handleLogout() {
            try {
                await fetch('/auth/logout', { method: 'POST', credentials: 'include' });
            } catch (e) { /* ignore — redirect anyway */ }
            window.location.href = '/auth/login';
        }
    </script>
</div>
</body>
</html>
