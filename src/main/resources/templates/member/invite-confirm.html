<!DOCTYPE html>
<html lang="ko"
      xmlns:th="http://www.thymeleaf.org"
      xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
      layout:decorate="~{common/layout/base-layout}">
<head>
    <title>초대 수락</title>
</head>
<body>
<div layout:fragment="body" class="min-h-screen bg-surface-base px-4 py-10 sm:px-6">
    <div class="mx-auto flex min-h-[calc(100vh-5rem)] max-w-lg items-center justify-center">
        <section class="card-modal w-full p-7 sm:p-8">
            <div class="mb-6 text-center">
                <img src="/images/logo.png" alt="DOCUMIND" class="mx-auto h-12 w-auto object-contain">
            </div>

            <div class="text-center space-y-4">
                <div class="mx-auto flex h-20 w-20 items-center justify-center rounded-full border border-docu-primary bg-docu-primary-light text-docu-primary"
                     aria-hidden="true">
                    <svg class="h-10 w-10" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M17 16l4-4m0 0l-4-4m4 4H7m6 4v1a3 3 0 01-3 3H6a3 3 0 01-3-3V7a3 3 0 013-3h4a3 3 0 013 3v1"/>
                    </svg>
                </div>

                <div class="space-y-2">
                    <span class="badge-event-new">프로젝트 초대</span>
                    <h1 class="text-h1 text-docu-ink leading-snug">
                        <span class="font-bold text-docu-primary" th:text="${data.projectName()}">Project RPG</span><br>
                        프로젝트에 초대되었습니다
                    </h1>
                </div>

                <p class="text-sm leading-6 text-docu-secondary">
                    <span class="font-semibold text-docu-ink" th:text="${data.inviterName()} + '님'">홍길동님</span>께서
                    함께 일하기 위해 초대하셨습니다.<br>
                    수락 시 해당 프로젝트의 멤버로 등록됩니다.
                </p>
            </div>

            <!-- Info Card -->
            <div class="card-base bg-surface-base p-5 space-y-3 mt-6">
                <div class="flex items-center justify-between text-sm gap-4">
                    <span class="font-medium text-docu-secondary">역할</span>
                    <span class="font-bold text-docu-ink"
                          th:text="${data.targetRole().name() == 'MANAGER' ? '관리자 (Manager)' : '멤버 (Member)'}">멤버</span>
                </div>
            </div>

            <!-- Countdown -->
            <div class="card-base bg-docu-warning-light/30 border-docu-warning px-4 py-3 mt-6">
                <div class="flex items-center justify-between gap-3">
                    <span class="text-xs font-bold uppercase tracking-wide text-docu-warning-dark">⏱ 초대 만료까지</span>
                    <span id="invite-countdown"
                          class="text-sm font-mono font-bold text-docu-warning-dark"
                          th:data-expires="${data.expiresAtEpochMs()}">계산 중...</span>
                </div>
            </div>

            <!-- Toast -->
            <div th:if="${topToast}"
                 class="mt-4 rounded-docu-btn border border-docu-danger bg-docu-danger-light px-4 py-3 text-sm font-medium text-docu-danger"
                 th:text="${topToast}"></div>

            <!-- Actions -->
            <form th:action="@{/invite/accept}" method="post" class="mt-6 flex flex-col gap-3 w-full">
                <input type="hidden" name="token" th:value="${data.rawToken()}">
                <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}"/>

                <button type="submit" class="btn-primary w-full">
                    초대 수락하기
                </button>

                <button type="button" onclick="history.back()" class="btn-secondary w-full">
                    거절하기 (뒤로가기)
                </button>
            </form>
        </section>
    </div>

    <script th:inline="javascript">
        /*<![CDATA[*/
        (function () {
            var intervalId = null;

            function pad(n) { return String(n).padStart(2, '0'); }

            function initCountdown() {
                const el = document.getElementById('invite-countdown');
                if (!el) return;

                if (intervalId) clearInterval(intervalId);

                const target = Number(el.dataset.expires);

                function tick() {
                    const diff = target - Date.now();

                    if (diff <= 0) {
                        el.textContent = '만료됨';
                        el.className = 'text-sm font-mono font-bold text-docu-danger';
                        const btn = document.querySelector('button[type="submit"]');
                        if (btn) {
                            btn.disabled = true;
                            btn.classList.add('opacity-50', 'cursor-not-allowed');
                        }
                        clearInterval(intervalId);
                        return;
                    }

                    const h = Math.floor(diff / 3600000);
                    const m = Math.floor((diff % 3600000) / 60000);
                    const s = Math.floor((diff % 60000) / 1000);
                    el.textContent = `${pad(h)}:${pad(m)}:${pad(s)} 후 만료`;

                    if (diff < 3600000) {
                        el.className = 'text-sm font-mono font-bold text-docu-danger';
                    }
                }

                tick();
                intervalId = setInterval(tick, 1000);
            }

            initCountdown();

            // bfcache로 페이지가 복원된 경우에도 카운트다운 재시작
            window.addEventListener('pageshow', function (e) {
                if (e.persisted) initCountdown();
            });
        })();
        /*]]>*/
    </script>
</div>
</body>
</html>
