<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="ko">
<head th:replace="~{common/fragments/head :: head('프로젝트 초대 확인')}"></head>
<body class="min-h-screen bg-gray-50 flex items-center justify-center p-4">

  <div class="w-full max-w-md bg-white rounded-2xl shadow-md overflow-hidden">

    <!-- Header -->
    <div class="bg-gray-900 px-8 py-6 text-center">
      <span class="text-white text-xl font-bold tracking-tight">📄 DocuMind</span>
    </div>

    <!-- Body -->
    <div class="px-8 py-8">

      <h1 class="text-xl font-bold text-gray-900 mb-1">프로젝트 초대</h1>
      <p class="text-sm text-gray-500 mb-6">아래 내용을 확인하고 초대를 수락하세요.</p>

      <!-- Info -->
      <div class="bg-gray-50 border border-gray-200 rounded-xl p-5 mb-6 space-y-3">
        <div class="flex items-center gap-3">
          <span class="text-xs text-gray-400 w-20 shrink-0">초대자</span>
          <span class="text-sm font-semibold text-gray-800"
                th:text="${data.inviterName()} + '님'">홍길동님</span>
        </div>
        <div class="flex items-center gap-3">
          <span class="text-xs text-gray-400 w-20 shrink-0">프로젝트</span>
          <span class="text-sm font-semibold text-gray-800"
                th:text="${data.projectName()}">Project RPG</span>
        </div>
        <div class="flex items-center gap-3">
          <span class="text-xs text-gray-400 w-20 shrink-0">역할</span>
          <span class="text-sm font-semibold text-gray-800"
                th:text="${data.targetRole().name() == 'MANAGER' ? '관리자 (Manager)' : '멤버 (Member)'}">멤버</span>
        </div>
      </div>

      <!-- Countdown Timer -->
      <div class="flex items-center justify-between bg-amber-50 border border-amber-200 rounded-xl px-5 py-3 mb-6">
        <span class="text-xs text-amber-600 font-medium">⏱ 초대 만료까지</span>
        <span id="invite-countdown"
              class="text-sm font-mono font-bold text-amber-700"
              th:data-expires="${data.expiresAtEpochMs()}">계산 중...</span>
      </div>

      <!-- Toast message from redirect (e.g. retry after error) -->
      <div th:if="${topToast}"
           class="mb-4 p-3 bg-red-50 border border-red-200 rounded-lg text-sm text-red-700"
           th:text="${topToast}"></div>

      <!-- Accept Form -->
      <form th:action="@{/invite/accept}" method="post">
        <input type="hidden" name="token" th:value="${data.rawToken()}"/>
          <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}"/>
          <button type="submit"
                class="w-full py-3 bg-indigo-600 hover:bg-indigo-700 text-white font-semibold
                       rounded-xl transition-colors">
          초대 수락하기
        </button>
      </form>

      <a href="javascript:history.back()"
         class="block text-center text-sm text-gray-400 hover:text-gray-600 mt-3">
        거절하고 돌아가기
      </a>
    </div>

  </div>

<script>
  (function () {
    const el = document.getElementById('invite-countdown');
    const target = Number(el.dataset.expires);

    function pad(n) { return String(n).padStart(2, '0'); }

    function tick() {
      const diff = target - Date.now();

      if (diff <= 0) {
        el.textContent = '만료됨';
        el.classList.remove('text-amber-700');
        el.classList.add('text-red-600');
        // 제출 버튼 비활성화
        const btn = document.querySelector('button[type="submit"]');
        if (btn) {
          btn.disabled = true;
          btn.classList.add('opacity-50', 'cursor-not-allowed');
        }
        return;
      }

      const h = Math.floor(diff / 3600000);
      const m = Math.floor((diff % 3600000) / 60000);
      const s = Math.floor((diff % 60000) / 1000);
      el.textContent = `${pad(h)}:${pad(m)}:${pad(s)} 후 만료`;

      // 1시간 미만이면 경고색 전환
      if (diff < 3600000) {
        el.classList.remove('text-amber-700');
        el.classList.add('text-red-600');
      }
    }

    tick();
    setInterval(tick, 1000);
  })();
</script>
</body>
</html>
