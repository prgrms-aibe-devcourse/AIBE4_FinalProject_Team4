<!DOCTYPE html>
<html lang="ko"
      xmlns:th="http://www.thymeleaf.org"
      xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
      layout:decorate="~{common/layout/mypage-layout}">
<head>
    <title>내 프로필</title>
</head>
<body>
<div layout:fragment="content">
    <div class="max-w-3xl mx-auto">

        <!-- 프로필 카드 -->
        <div class="bg-surface-card rounded-docu-card border border-divider shadow-docu-card overflow-hidden">

            <!-- 상단 배너: 프로필 이미지 + 이름 + 뱃지 -->
            <div class="bg-surface-card px-8 pt-8 pb-6 border-b border-divider">
                <div class="flex items-center gap-6">

                    <!-- 프로필 이미지 (호버 연필 overlay) -->
                    <div class="relative shrink-0">
                        <button type="button"
                                onclick="document.getElementById('profile-image-input').click()"
                                class="relative group w-24 h-24 rounded-full overflow-hidden border-2 border-divider shadow-docu-sm bg-docu-primary-light cursor-pointer">
                            <img th:if="${profile?.profileImageUrl() != null}"
                                 th:src="${profile.profileImageUrl()}"
                                 id="profile-img-preview"
                                 alt="프로필 이미지"
                                 class="w-full h-full object-cover"/>
                            <div th:unless="${profile?.profileImageUrl() != null}"
                                 id="profile-img-fallback"
                                 class="w-full h-full bg-docu-primary flex items-center justify-center">
                                <span th:text="${profile?.nickname() != null ? #strings.substring(profile.nickname(),0,1) : 'U'}"
                                      class="text-3xl font-bold text-white">U</span>
                            </div>
                            <!-- 호버 오버레이 (연필) -->
                            <div class="absolute inset-0 bg-black/30 opacity-0 group-hover:opacity-100 transition-opacity flex items-center justify-center">
                                <svg class="w-6 h-6 text-white" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15.232 5.232l3.536 3.536m-2.036-5.036a2.5 2.5 0 113.536 3.536L6.5 21.036H3v-3.572L16.732 3.732z"/>
                                </svg>
                            </div>
                        </button>
                        <input type="file" id="profile-image-input" accept="image/*" class="hidden" onchange="previewImage(this)"/>
                        <input type="hidden" id="profile-img-original-src" th:value="${profile?.profileImageUrl()}"/>
                    </div>

                    <!-- 이름 + 뱃지 + 이메일 -->
                    <div>
                        <div class="flex items-center gap-2 mb-1">
                            <span th:text="${profile?.name() ?: '이름'}" class="text-h1 text-docu-ink">이름</span>

                            <!-- 역할 뱃지 (th:replace는 th:if보다 우선순위가 높아서 wrapper 분리 필수) -->
                            <th:block th:if="${profile != null and profile.globalRole() != null}">
                                <th:block th:if="${profile.globalRole().name() == 'CEO'}">
                                    <span th:replace="~{common/fragments/ui-components :: badge-status('대표', 'selected')}"></span>
                                </th:block>
                                <th:block th:if="${profile.globalRole().name() == 'ADMIN'}">
                                    <span th:replace="~{common/fragments/ui-components :: badge-severity('운영자', 'critical')}"></span>
                                </th:block>
                                <th:block th:if="${profile.globalRole().name() == 'EMPLOYEE'}">
                                    <span th:replace="~{common/fragments/ui-components :: badge-status('직원', 'plan')}"></span>
                                </th:block>
                            </th:block>
                        </div>
                        <p class="text-sm text-docu-secondary flex items-center gap-1.5">
                            <svg class="w-3.5 h-3.5 shrink-0" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M3 8l7.89 5.26a2 2 0 002.22 0L21 8M5 19h14 a2 2 0 002-2V7a2 2 0 00-2-2H5a2 2 0 00-2 2v10a2 2 0 002 2z"/>
                            </svg>
                            <span th:text="${profile?.email() ?: '이메일'}">email</span>
                        </p>
                    </div>
                </div>
            </div>

            <!-- 본문 -->
            <div class="p-8">
                <!-- 글로벌 에러 / 성공 메시지 -->
                <div id="global-error" class="hidden mb-6 p-4 bg-docu-danger-light border border-docu-danger rounded-docu-btn text-sm text-docu-danger"></div>
                <div id="success-message" class="hidden mb-6 p-4 bg-docu-success-light border border-docu-success rounded-docu-btn text-sm text-docu-success-dark"></div>

                <div class="grid gap-8" th:classappend="${profile != null and profile.globalRole() != null and profile.globalRole().name() == 'ADMIN'} ? 'grid-cols-1' : 'grid-cols-1 lg:grid-cols-5'">

                    <!-- 왼쪽: 기본 정보 수정 -->
                    <div th:classappend="${profile != null and profile.globalRole() != null and profile.globalRole().name() == 'ADMIN'} ? '' : 'lg:col-span-3'">
                        <h3 class="flex items-center gap-2 text-sm font-bold text-docu-primary mb-5 uppercase tracking-wide">
                            <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M10.325 4.317c.426-1.756 2.924-1.756 3.35 0a1.724 1.724 0 002.573 1.066 c1.543-.94 3.31.826 2.37 2.37a1.724 1.724 0 001.065 2.572c1.756.426 1.756 2.924 0 3.35a1.724 1.724 0 00-1.066 2.573c.94 1.543-.826 3.31-2.37 2.37a1.724 1.724 0 00-2.572 1.065c-.426 1.756-2.924 1.756-3.35 0a1.724 1.724 0 00-2.573-1.066 c-1.543.94-3.31-.826-2.37-2.37a1.724 1.724 0 00-1.065-2.572c-1.756-.426 -1.756-2.924 0-3.35a1.724 1.724 0 001.066-2.573c-.94-1.543.826-3.31 2.37-2.37 .996.608 2.296.07 2.572-1.065z"/>
                                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15 12a3 3 0 11-6 0 3 3 0 016 0z"/>
                            </svg>
                            기본 정보 수정
                        </h3>

                        <!-- 닉네임 -->
                        <div class="mb-5">
                            <label for="nickname" class="form-label uppercase tracking-wide mb-1.5">
                                닉네임 <span class="text-docu-danger">*</span>
                            </label>
                            <input type="text" id="nickname" name="nickname" th:value="${profile?.nickname()}" maxlength="20" placeholder="닉네임을 입력하세요"
                                   class="w-full px-4 py-2.5 bg-white border-2 border-divider rounded-docu-btn text-sm text-docu-ink focus:outline-none focus:border-docu-primary focus:ring-0 transition-colors"/>
                            <p class="mt-1.5 text-xs text-docu-secondary">커뮤니티와 리포트 생성 시 표시될 이름입니다.</p>
                            <p id="nickname-error" class="hidden mt-1 text-xs text-docu-danger font-medium"></p>
                        </div>

                        <!-- 이름 + 이메일 -->
                        <div class="grid grid-cols-2 gap-4">
                            <div>
                                <label class="form-label uppercase tracking-wide mb-1.5">이름</label>
                                <div class="flex items-center gap-2 px-4 py-2.5 bg-surface-sub border border-divider rounded-docu-btn text-sm text-docu-secondary">
                                    <svg class="w-4 h-4 text-docu-secondary shrink-0" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M16 7a4 4 0 11-8 0 4 4 0 018 0zM12 14a7 7 0 00-7 7h14a7 7 0 00-7-7z"/>
                                    </svg>
                                    <span th:text="${profile?.name() ?: '-'}">이름</span>
                                </div>
                            </div>
                            <div>
                                <label class="form-label uppercase tracking-wide mb-1.5">이메일</label>
                                <div class="flex items-center gap-2 px-4 py-2.5 bg-surface-sub border border-divider rounded-docu-btn text-sm text-docu-secondary">
                                    <svg class="w-4 h-4 text-docu-secondary shrink-0" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M3 8l7.89 5.26a2 2 0 002.22 0L21 8M5 19h14a2 2 0 002-2V7 a2 2 0 00-2-2H5a2 2 0 00-2 2v10a2 2 0 002 2z"/>
                                    </svg>
                                    <span th:text="${profile?.email() ?: '-'}" class="truncate">이메일</span>
                                </div>
                            </div>
                        </div>
                    </div>

                    <!-- 오른쪽: 소속 정보 -->
                    <div th:if="${profile == null or profile.globalRole() == null or profile.globalRole().name() != 'ADMIN'}" class="lg:col-span-2">
                        <h3 class="flex items-center gap-2 text-sm font-bold text-docu-success mb-5 uppercase tracking-wide">
                            <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M19 21V5a2 2 0 00-2-2H7a2 2 0 00-2 2v16m14 0h2m-2 0h-5 m-9 0H3m2 0h5M9 7h1m-1 4h1m4-4h1m-1 4h1m-5 10v-5a1 1 0 011-1h2 a1 1 0 011 1v5m-4 0h4"/>
                            </svg>
                            소속 정보
                        </h3>

                        <div class="bg-surface-base rounded-docu-card border border-divider p-5 space-y-4">
                            <!-- 소속 회사 -->
                            <div class="flex items-center gap-3">
                                <div class="w-9 h-9 rounded-docu-btn bg-docu-primary-light flex items-center justify-center shrink-0 border border-docu-primary/20">
                                    <svg class="w-4 h-4 text-docu-primary" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M19 21V5a2 2 0 00-2-2H7a2 2 0 00-2 2v16m14 0h2m-2 0h-5 m-9 0H3m2 0h5M9 7h1m-1 4h1m4-4h1m-1 4h1m-5 10v-5a1 1 0 011-1h2 a1 1 0 011 1v5m-4 0h4"/>
                                    </svg>
                                </div>
                                <div>
                                    <p class="form-label mb-0.5 uppercase">소속 회사</p>
                                    <p class="text-sm font-bold text-docu-ink" th:text="${profile?.companyName() ?: '미등록'}">회사명</p>
                                </div>
                            </div>

                            <!-- 직급 -->
                            <div class="flex items-start gap-3">
                                <div class="w-9 h-9 rounded-docu-btn bg-docu-warning-light flex items-center justify-center shrink-0 mt-0.5 border border-docu-warning/20">
                                    <svg class="w-4 h-4 text-docu-warning-dark" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M21 13.255A23.931 23.931 0 0112 15c-3.183 0-6.22-.62-9-1.745M16 6V4 a2 2 0 00-2-2h-4a2 2 0 00-2 2v2m4 6h.01M5 20h14a2 2 0 002-2V8 a2 2 0 00-2-2H5a2 2 0 00-2 2v10a2 2 0 002 2z"/>
                                    </svg>
                                </div>
                                <div class="flex-1">
                                    <label for="position" class="form-label mb-1 uppercase">직급</label>
                                    <input type="text" id="position" name="position" th:value="${profile?.position()}" maxlength="20" placeholder="직급을 입력하세요"
                                           class="form-input"/>
                                    <p id="position-error" class="hidden mt-1 text-xs text-docu-danger font-medium"></p>
                                </div>
                            </div>

                            <!-- 가입일 -->
                            <p class="text-xs text-docu-secondary pt-1 border-t border-divider">
                                가입일: <span th:if="${profile?.joinedAt() != null}" th:text="${profile.joinedAt()}" class="font-mono text-docu-ink ml-1">2021.05.12</span>
                                <span th:unless="${profile?.joinedAt() != null}">-</span>
                            </p>
                        </div>
                    </div>
                </div>
            </div>

            <!-- 하단 버튼 -->
            <div class="px-8 pb-8 flex justify-end gap-3 border-t border-divider pt-6 mt-6 bg-surface-base/30">
                <button type="button" onclick="resetForm()" class="btn-ghost">
                    취소
                </button>
                <button type="button" onclick="saveProfile()" class="btn-primary">
                    변경 사항 저장
                </button>
            </div>
        </div>
    </div>

    <!-- 스크립트 로드 -->
    <script th:src="@{/js/member/MyProfile.js}"></script>
</div>
</body>
</html>
